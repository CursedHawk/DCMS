# ---------------------------------------------------------------------------
# DCMS pipeline.
#
#   merge request   build + test. No images, no deploy.
#   push to master  build + test -> images (:<sha>, :dev) -> deploy to DEVELOPMENT (vps1)
#   tag v*          PROMOTE the images already built for that commit -> manual gate ->
#                   deploy to PRODUCTION
#
# The promotion never rebuilds. A tag pipeline retags the digests that were built and
# deployed to dev from the same commit, so production runs the exact bits dev validated --
# a rebuild from the same source can differ (base image moved, a dependency republished)
# and would silently invalidate everything the dev environment proved.
#
# Deploys are by DIGEST, not tag. scripts/ci/resolve-digests.sh writes a compose overlay
# pinning every service to a sha256, the overlay is kept on the target host, and
# `scripts/deploy.sh --rollback` re-applies the previous one. See that script for why.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   SSH_PRIVATE_KEY        File type (a private key is multi-line, and GitLab cannot mask a
#                          multi-line value). Plain type also works.
#   SSH_KNOWN_HOSTS        File or plain; the targets' host keys (ssh-keyscan output)
#   DEV_DEPLOY_TARGET      e.g. cursedhawk@vps1.example.com
#   PROD_DEPLOY_TARGET     e.g. deploy@prod.example.com
#   DEV_DEPLOY_PATH        default baas-dcms
#   PROD_DEPLOY_PATH       default baas-dcms
#
# Registry credentials are NOT among these. The deploy job logs the target in with its own
# $CI_JOB_TOKEN and logs it out again when the job ends, so no long-lived registry credential
# ever rests on a serving host.
# ---------------------------------------------------------------------------

stages:
  - build
  - test
  - images
  - promote
  - deploy

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # Repo path on each deploy target. Overridable per environment in CI/CD settings.
  DEV_DEPLOY_PATH: "baas-dcms"
  PROD_DEPLOY_PATH: "baas-dcms"

# ---------------------------------------------------------------------------
# build + test
# ---------------------------------------------------------------------------

dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet build Dcms.sln -c Release
    - dotnet test Dcms.sln -c Release --no-build --logger "junit;LogFilePath=./TestResults/{assembly}.xml" || dotnet test Dcms.sln -c Release --no-build
  artifacts:
    when: always
    reports:
      junit: "**/TestResults/*.xml"
    expire_in: 1 week

frontend:
  stage: build
  image: node:24-alpine
  before_script:
    # Pinned to the major that wrote pnpm-lock.yaml. Unpinned, a pnpm major release changes the
    # lockfile format and --frozen-lockfile starts failing on a commit that changed nothing.
    - npm install -g pnpm@11
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r build

# Integration tests need Docker-in-Docker (Testcontainers); enabled on runners
# that support it.
integration:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - dotnet test tests/Dcms.IntegrationTests -c Release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# images
#
# One image per service, pushed to this project's registry as
# $CI_REGISTRY_IMAGE/<service>. Every service builds from the repo root as its Docker
# context, matching docker-compose.yml.
#
# Tags: <short-sha> always (immutable, traceable), plus `dev` on the default branch. There
# is deliberately no `latest`: it is the tag people deploy by accident.
# ---------------------------------------------------------------------------

.build-image:
  stage: images
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
    # Warm the layer cache from the last dev build (best-effort).
    - docker pull "$IMAGE:dev" || true
    - >
      docker build
      --file "$DOCKERFILE"
      --cache-from "$IMAGE:dev"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag "$IMAGE:$CI_COMMIT_SHORT_SHA"
      .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:dev"
    - docker push "$IMAGE:dev"
  # ONE image job at a time, and this is not a preference.
  #
  # There are more runners than this matrix has entries, so without a resource group all ten
  # build and push at once -- into a registry that runs inside the GitLab container, on the
  # same 4-core box that serves GitLab itself. The first run of this pipeline drove the load
  # average past 50, pinned that container against its memory limit, made the web UI return
  # 504, and failed seven of the ten pushes. The two that succeeded were the two that finished
  # before the pile-up.
  #
  # The runners are elsewhere, but the registry is not, so parallelism here buys nothing and
  # costs the box. It is the same lesson the deploy has already learned twice about building
  # more than two services at once on a small host.
  #
  # Layer caching from :dev makes the serial run far cheaper than the first one suggests.
  resource_group: registry
  # A superseded pipeline should stop building images nobody will deploy, rather than queue
  # behind the resource group and delay the one that matters.
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-image:
  extends: .build-image
  parallel:
    matrix:
      - SERVICE: identity
        DOCKERFILE: src/Services/Dcms.Identity/Dockerfile
      - SERVICE: admin-api
        DOCKERFILE: src/Services/Dcms.AdminApi/Dockerfile
      - SERVICE: content-api
        DOCKERFILE: src/Services/Dcms.ContentApi/Dockerfile
      - SERVICE: media-worker
        DOCKERFILE: src/Services/Dcms.MediaWorker/Dockerfile
      # email-worker and site-build-sandbox were missing from this matrix entirely, so
      # email-worker had never had a registry image and the Mode B build sandbox had to be
      # built by hand on the host.
      - SERVICE: email-worker
        DOCKERFILE: src/Services/Dcms.EmailWorker/Dockerfile
      - SERVICE: site-builder
        DOCKERFILE: src/Services/Dcms.SiteBuilder/Dockerfile
      - SERVICE: site-build-sandbox
        DOCKERFILE: src/Services/Dcms.SiteBuilder/sandbox.Dockerfile
      - SERVICE: site-host
        DOCKERFILE: src/Services/Dcms.SiteHost/Dockerfile
      - SERVICE: ai-gateway
        DOCKERFILE: src/Services/Dcms.AiGateway/Dockerfile
      - SERVICE: admin-spa
        DOCKERFILE: apps/admin/Dockerfile

# ---------------------------------------------------------------------------
# promote
#
# Tag pipelines only. Copies the manifest built from this commit to the tag, without
# rebuilding. `imagetools create` is a registry-side manifest copy: it never pulls or
# re-pushes layers, and the digest is unchanged by construction.
#
# If no image exists at this commit's sha, the tag was created on a commit that never
# reached master -- which is exactly the case this job should refuse rather than paper over
# by building something new.
# ---------------------------------------------------------------------------

promote-images:
  stage: promote
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -e
      for SERVICE in identity admin-api content-api media-worker email-worker \
                     site-builder site-build-sandbox site-host ai-gateway admin-spa; do
        IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
        if ! docker buildx imagetools inspect "$IMAGE:$CI_COMMIT_SHORT_SHA" >/dev/null 2>&1; then
          echo "No image at $IMAGE:$CI_COMMIT_SHORT_SHA."
          echo "A release tag must point at a commit that was built on $CI_DEFAULT_BRANCH."
          exit 1
        fi
        docker buildx imagetools create \
          --tag "$IMAGE:$CI_COMMIT_TAG" \
          --tag "$IMAGE:stable" \
          "$IMAGE:$CI_COMMIT_SHORT_SHA"
        echo "promoted $SERVICE -> $CI_COMMIT_TAG"
      done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ---------------------------------------------------------------------------
# deploy
# ---------------------------------------------------------------------------

.deploy:
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Accept SSH_PRIVATE_KEY as either a File-type variable (the value is a path) or a plain
    # one (the value is the key). A private key is multi-line, and GitLab cannot mask a
    # multi-line value -- so File type is the better choice here and this supports both
    # rather than failing confusingly on whichever one was picked.
    - if [ -f "$SSH_PRIVATE_KEY" ]; then cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519; else printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519; fi
    - chmod 600 ~/.ssh/id_ed25519
    # Pinned host keys, not StrictHostKeyChecking=no: a deploy job that accepts any host key
    # will happily hand the deployment to whatever answers on that address.
    - if [ -f "$SSH_KNOWN_HOSTS" ]; then cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts; else printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
    - chmod 644 ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519
  script:
    - bash scripts/ci/resolve-digests.sh "$CI_REGISTRY_IMAGE" "$IMAGE_TAG" docker-compose.images.yml
    - cat docker-compose.images.yml
    # The target is logged in to the registry with THIS JOB's token, and logged out again
    # when the script exits. No long-lived deploy token lives on a serving host.
    - >
      bash scripts/ci/deploy-remote.sh
      --env "$DEPLOY_ENV" --host "$DEPLOY_TARGET" --path "$DEPLOY_PATH"
      --images docker-compose.images.yml
      --registry "$CI_REGISTRY" --registry-user gitlab-ci-token
      --registry-password-env CI_JOB_TOKEN
  artifacts:
    # Keep the exact digest set that was deployed. It is the record of what a given pipeline
    # put on a host, and the thing to hand back to --rollback if the host's copy is lost.
    paths:
      - docker-compose.images.yml
    expire_in: 90 days

deploy:dev:
  extends: .deploy
  stage: deploy
  variables:
    DEPLOY_ENV: dev
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DEPLOY_TARGET: $DEV_DEPLOY_TARGET
    DEPLOY_PATH: $DEV_DEPLOY_PATH
  environment:
    name: development
    url: https://admin.dev.highgeek.eu
    deployment_tier: development
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:prod:
  extends: .deploy
  stage: deploy
  needs: ["promote-images"]
  variables:
    DEPLOY_ENV: prod
    IMAGE_TAG: $CI_COMMIT_TAG
    DEPLOY_TARGET: $PROD_DEPLOY_TARGET
    DEPLOY_PATH: $PROD_DEPLOY_PATH
  environment:
    name: production
    url: https://admin.highgeek.eu
    deployment_tier: production
  # Only one production deploy at a time. Two concurrent runs would race on the host's
  # rollback state and could leave --rollback pointing at a release that never ran.
  resource_group: production
  rules:
    # Manual, and not automatic on a tag. A tag says "this is a release"; a person still
    # says "put it in front of users". Protect the `production` environment so that person
    # has to be allowed to.
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
      allow_failure: false
