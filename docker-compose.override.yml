# Development overrides: host ports, verbose logging. Applied automatically by a bare
# `docker compose up`. Deployed environments pass an explicit -f list, which disables
# auto-loading, so nothing here can reach dev or production.
#
# ASPNETCORE_ENVIRONMENT=Development is set on every .NET service below, and it is
# load-bearing rather than cosmetic. Without it the containers default to Production,
# where the platform's startup guards fire on configuration this file deliberately does
# not supply -- admin-api refuses to boot without Audit:ChainKey, content-api without
# Visitor:SigningKey, identity without persisted OIDC certificates. Those guards are
# correct; the base file is simply not a production configuration (it hardcodes
# `dcms-dev` and `dcms-dev-root`), so it has to say so.
x-dev-env: &dev-env
  ASPNETCORE_ENVIRONMENT: "Development"
  DOTNET_ENVIRONMENT: "Development"

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  nats:
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  vault:
    ports:
      - "8200:8200"

  mailpit:
    ports:
      - "8025:8025"
      - "1025:1025"

  identity:
    environment:
      <<: *dev-env
    ports:
      - "5001:8080"
      # OIDC issuer host port: with a "127.0.0.1 dcms-identity" hosts entry the
      # browser reaches the same http://dcms-identity:8080 the services use.
      - "8080:8080"

  admin-api:
    environment:
      <<: *dev-env
    ports:
      - "5002:8080"

  content-api:
    environment:
      <<: *dev-env
    ports:
      - "5003:8080"

  media-worker:
    environment:
      <<: *dev-env
    ports:
      - "5004:8080"

  site-builder:
    environment:
      <<: *dev-env
    ports:
      - "5005:8080"

  site-host:
    environment:
      <<: *dev-env
    ports:
      - "5006:8080"

  ai-gateway:
    environment:
      <<: *dev-env
    ports:
      - "5007:8080"

  platform-api:
    environment:
      <<: *dev-env
    ports:
      - "5008:8080"

  platform-spa:
    ports:
      - "5010:80"

  admin-spa:
    ports:
      - "5000:80"

  # Observability, dev only. In production none of these publish a port — Grafana is
  # reached through the edge and the stores are internal. Grafana is on 3001 rather than its
  # default 3000 because vps1 already has Forgejo on 3000, and a dev port that collides
  # with a production port is a trap waiting for whoever debugs against a tunnel.
  grafana:
    ports:
      - "3001:3000"

  prometheus:
    ports:
      - "9090:9090"

  loki:
    ports:
      - "3100:3100"

  tempo:
    ports:
      - "3200:3200"

  alloy:
    ports:
      # Alloy's own UI, which shows every component's state and is the fastest way to see
      # why a pipeline is not producing anything.
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"

  nats-exporter:
    ports:
      - "7777:7777"

  # No host ports to publish -- present only to inherit the development environment.
  email-worker:
    environment:
      <<: *dev-env

  migrate:
    environment:
      <<: *dev-env

  identity-migrate:
    environment:
      <<: *dev-env

  postgres-bootstrap:
    environment:
      <<: *dev-env
