# Development overrides: host ports, verbose logging. Applied automatically by
# `docker compose up`. Production deployments use docker-compose.yml alone
# (plus a prod profile added in Phase 12).
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  nats:
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  vault:
    ports:
      - "8200:8200"

  mailpit:
    ports:
      - "8025:8025"
      - "1025:1025"

  identity:
    ports:
      - "5001:8080"
      # OIDC issuer host port: with a "127.0.0.1 dcms-identity" hosts entry the
      # browser reaches the same http://dcms-identity:8080 the services use.
      - "8080:8080"

  admin-api:
    ports:
      - "5002:8080"

  content-api:
    ports:
      - "5003:8080"

  media-worker:
    ports:
      - "5004:8080"

  site-builder:
    ports:
      - "5005:8080"

  site-host:
    ports:
      - "5006:8080"

  ai-gateway:
    ports:
      - "5007:8080"

  admin-spa:
    ports:
      - "5000:80"

  # Observability, dev only. In production none of these publish a port — Grafana is
  # reached through Caddy and the stores are internal. Grafana is on 3001 rather than its
  # default 3000 because vps1 already has Forgejo on 3000, and a dev port that collides
  # with a production port is a trap waiting for whoever debugs against a tunnel.
  grafana:
    ports:
      - "3001:3000"

  prometheus:
    ports:
      - "9090:9090"

  loki:
    ports:
      - "3100:3100"

  tempo:
    ports:
      - "3200:3200"

  alloy:
    ports:
      # Alloy's own UI, which shows every component's state and is the fastest way to see
      # why a pipeline is not producing anything.
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"

  nats-exporter:
    ports:
      - "7777:7777"
