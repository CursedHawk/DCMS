packages:
  - apps/*
  - packages/*
  # The Mode B dependency palette drives IDE type hints only (not a build allowlist);
  # it is never installed for development.
  - '!packages/site-builder-toolchain'
allowBuilds:
  # Tailwind v4's native oxide binary; needed to build the tenant sites.
  '@tailwindcss/oxide': true
  esbuild: true
  vue-demi: true
# DEP-01: pin transitive advisories to their patched version within the same major. All are
# deep transitives of the admin SPA's API-reference viewer / rjsf / vite toolchain — an
# override is the surgical fix, leaving the direct deps put. unhead and ts-deepmerge needed a
# major their consumer refused, so @scalar/api-reference-react was bumped 0.7 -> 0.9 instead
# (0.9 ships @unhead/vue 2 and drops ts-deepmerge); undici and @ai-sdk/provider-utils below are
# what that newer Scalar brought in. vitest went 3 -> 4 in the seven packages that declare it.
overrides:
  postcss: ^8.5.23
  nanoid@^3.0.0: ^3.3.18
  nanoid@^5.0.0: ^5.1.16
  fast-uri: ^3.1.6
  shell-quote: ^1.8.5
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  yaml: ^2.8.3
  esbuild: ^0.28.1
  undici: ^7.29.0
  '@ai-sdk/provider-utils': ^4.0.33
