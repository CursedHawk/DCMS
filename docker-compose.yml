name: dcms

# Docker's json-file driver is unbounded by default. Nothing rotated these until now, and
# the host has already needed a container log deleted by hand under disk pressure. 3x50MB
# per container caps the whole stack at well under a gigabyte, and Loki holds the searchable
# copy anyway — these files are only the last few minutes before Alloy picks them up.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Telemetry, and NOTHING else. Split out of x-service-env because these two are not
# credentials and every service needs them -- including the two that deliberately refuse
# the rest of that anchor.
#
# site-builder and email-worker opt out of *service-env for least privilege (scoped
# Postgres role, scoped MinIO account, no Vault token). Because the OTEL variables lived
# inside it, they opted out of telemetry too -- silently, since AddDcmsServiceDefaults
# builds the pipelines unconditionally and only attaches an exporter when the endpoint is
# set. The result was two of eight services in no Prometheus series at all: 172 site builds
# recorded nowhere, the site-builds and email dashboards permanently blank,
# dcms:tenant_builds:rate1h unable to fire, and no trace ever leaving either process.
# obs-smoke.sh could not catch it either, because it counts each metric globally rather
# than per service.
x-otel-env: &otel-env
  # Turns the OpenTelemetry export on. AddDcmsServiceDefaults builds the tracer, meter and
  # log pipelines unconditionally but only attaches an exporter when this is set, so an
  # unset value means "collect nothing, cost nothing" for a bare `dotnet run`.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

x-service-env: &service-env
  <<: *otel-env
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms;Password=dcms-dev"
  ConnectionStrings__Redis: "redis:6379"
  Nats__Url: "nats://nats:4222"
  Storage__Endpoint: "minio:9000"
  Storage__AccessKey: "dcms"
  Storage__SecretKey: "dcms-dev-secret"
  VAULT_ADDR: "http://vault:8200"
  VAULT_TOKEN: "dcms-dev-root"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nats:
      condition: service_started
    minio:
      condition: service_healthy
    vault:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:18
    logging: *default-logging
    environment:
      POSTGRES_DB: dcms
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: dcms-dev
    volumes:
      # postgres:18 stores data in a major-version subdirectory and expects the
      # volume mounted at /var/lib/postgresql (not /var/lib/postgresql/data).
      # See https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms -d dcms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11
    logging: *default-logging
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_started
    volumes:
      - ./infra/nats/provision-streams.sh:/provision-streams.sh:ro
    entrypoint: ["sh", "/provision-streams.sh"]
    environment:
      NATS_URL: "nats://nats:4222"

  minio:
    image: minio/minio:latest
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dcms
      MINIO_ROOT_PASSWORD: dcms-dev-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      MINIO_URL: "http://minio:9000"
      MINIO_ROOT_USER: dcms
      MINIO_ROOT_PASSWORD: dcms-dev-secret

  vault:
    # 200 only when Vault is initialised, unsealed and active; a sealed Vault answers 503
    # and shows up here as unhealthy. That is the state worth surfacing -- every service
    # reads its configuration from Vault at startup, so a sealed Vault is not a degraded
    # dependency, it is a platform that cannot boot. Nothing depends_on this condition
    # (services use service_started), so an unhealthy Vault reports rather than blocks.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    image: hashicorp/vault:latest
    logging: *default-logging
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dcms-dev-root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_started
    volumes:
      - ./infra/vault/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dcms-dev-root"

  mailpit:
    image: axllent/mailpit:latest
    logging: *default-logging

  # Self-hosted git server (Gitea community fork). Source of truth for Mode B
  # (ReactApp) site source: one repo per site, edited in the web IDE and cloneable
  # over HTTP/SSH with the git CLI. Metadata lives in an embedded SQLite DB inside
  # the data volume; the git repositories live under /data/git. A push to a site's
  # default branch fires a webhook back to admin-api to trigger the offline build.
  forgejo:
    # Forgejo holds the tenant site repositories, which are the one thing on this host that
    # is not reproducible from the registry and this repository.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    image: codeberg.org/forgejo/forgejo:11
    logging: *default-logging
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: "sqlite3"
      FORGEJO__server__DOMAIN: "localhost"
      FORGEJO__server__ROOT_URL: "http://localhost:3000/"
      FORGEJO__server__HTTP_PORT: "3000"
      # Git SSH: use the image's built-in openssh (listens on container :22). The
      # advertised clone port is 2222 (host), published as 2222 -> 22 below, so
      # clone URLs read git@git.highgeek.eu:2222. (Don't run Forgejo's own SSH
      # server — it conflicts with the container's openssh.)
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      # No public web installer: the server is provisioned headless (secrets are
      # auto-generated on first boot when install is locked) and the first admin
      # is created out-of-band via the CLI. Self-registration stays off so only
      # platform-provisioned accounts exist.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      # Webhooks target admin-api on the internal docker network (a private host),
      # which Forgejo's SSRF guard blocks by default — allow the internal range.
      FORGEJO__webhook__ALLOWED_HOST_LIST: "private,loopback"
    volumes:
      - forgejo-data:/data
    ports:
      # HTTP/web UI on loopback only — in prod Caddy proxies it over the internal
      # network and terminates TLS; in dev the developer reaches it at localhost.
      - "127.0.0.1:3000:3000"
      # Git SSH is published on all interfaces so `git clone ssh://…:2222` works
      # from outside the host (host 2222 -> container openssh on 22).
      - "2222:22"

  # ---------- application services ----------
  identity:
    build:
      context: .
      dockerfile: src/Services/Dcms.Identity/Dockerfile
    <<: *service-defaults
    # The "dcms-identity" alias is the single issuer hostname used by BOTH the
    # browser (via a 127.0.0.1 hosts entry — see runbook) and the backend
    # services (internal DNS), so token issuer / jwks_uri resolve identically.
    networks:
      default:
        aliases:
          - dcms-identity
    environment:
      <<: *service-env
      Identity__Issuer: "http://dcms-identity:8080/"
      Identity__AllowInsecureHttp: "true"
      Identity__Spa__RedirectUris: "http://localhost:5173/auth/callback;http://localhost:5000/auth/callback"
      Identity__Spa__PostLogoutUris: "http://localhost:5173/;http://localhost:5000/"
      # The platform console: 5174 is its vite dev server, 5010 its nginx container.
      Identity__PlatformSpa__RedirectUris: "http://localhost:5174/auth/callback;http://localhost:5010/auth/callback"
      Identity__PlatformSpa__PostLogoutUris: "http://localhost:5174/;http://localhost:5010/"
      # Dev only: the SPAs reach identity cross-origin here (vite on 5173/5174 -> identity on
      # 5001). Behind Caddy both are same-origin with /connect/*, which is why prod overrides
      # this with just PUBLIC_BASE_URL.
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5000"
      Cors__AllowedOrigins__2: "http://localhost:5174"
      Cors__AllowedOrigins__3: "http://localhost:5010"
      # Grafana SSO against the dev stack, where Grafana is published on 3001.
      Identity__Grafana__Secret: "${GRAFANA_OIDC_CLIENT_SECRET:-grafana-dev-secret}"
      Identity__Grafana__RedirectUris: "http://localhost:3001/login/generic_oauth"

  # ---------- cluster bootstrap ----------
  #
  # One-shot, and the counterpart to the migration jobs: those create TABLES, this creates
  # the schemas, extensions and roles the tables live in and are granted to.
  #
  # infra/postgres/init/* is mounted into the postgres container's docker-entrypoint-initdb.d,
  # which runs once on an empty data directory and never again. Every script there is written
  # idempotently, so the only thing missing was something to re-run them -- which is why every
  # role added since vps1 was provisioned had to be created by hand against production.
  postgres-bootstrap:
    profiles: ["migrate"]
    image: postgres:18
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/init:/init:ro
      - ./infra/postgres/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_USER: dcms
      POSTGRES_DB: dcms
      PGPASSWORD: "dcms-dev"
      SITEBUILDER_DB_PASSWORD: "dcms-sitebuilder-dev"
      EDGE_DB_PASSWORD: "dcms-edge-dev"
      GRAFANA_DB_PASSWORD: "dcms-grafana-dev"
      RLS_DB_PASSWORD: "dcms-rls-dev"

  # ---------- schema migration jobs ----------
  #
  # One-shot. The deploy pipeline runs these BEFORE rolling any service, so DDL happens
  # once, from one process, with nothing serving traffic against a half-migrated schema.
  # `scripts/deploy.sh --migrate` runs them; they are behind the "migrate" profile so a
  # plain `up -d` never starts them.
  #
  # Two jobs rather than one because two services own schemas: admin-api owns everything
  # in the platform database, identity owns its own tables plus OpenIddict's. Each takes
  # a distinct Postgres advisory lock, so concurrent execution would not corrupt anything
  # -- but they are run in order regardless, `migrate` first: identity's DbContext maps
  # the audit outbox, so seeding a user writes an audit row, and the audit schema is
  # created by the admin-api job.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: src/Services/Dcms.AdminApi/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    environment:
      <<: *service-env
      # The job migrates regardless of these; they are set so the job's configuration
      # matches the services' and a Vault lookup failure surfaces here, in a job whose
      # exit code stops the deploy, rather than later in a rolling service.
      Tenancy__Migrate: "true"

  identity-migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: src/Services/Dcms.Identity/Dockerfile
    command: ["--migrate-only"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    environment:
      <<: *service-env
      Identity__Issuer: "http://dcms-identity:8080/"
      Identity__AllowInsecureHttp: "true"
      Identity__Spa__RedirectUris: "http://localhost:5173/auth/callback;http://localhost:5000/auth/callback"
      Identity__Spa__PostLogoutUris: "http://localhost:5173/;http://localhost:5000/"
      # The platform console: 5174 is its vite dev server, 5010 its nginx container.
      Identity__PlatformSpa__RedirectUris: "http://localhost:5174/auth/callback;http://localhost:5010/auth/callback"
      Identity__PlatformSpa__PostLogoutUris: "http://localhost:5174/;http://localhost:5010/"
      # Dev only: the SPAs reach identity cross-origin here (vite on 5173/5174 -> identity on
      # 5001). Behind Caddy both are same-origin with /connect/*, which is why prod overrides
      # this with just PUBLIC_BASE_URL.
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5000"
      Cors__AllowedOrigins__2: "http://localhost:5174"
      Cors__AllowedOrigins__3: "http://localhost:5010"
      Identity__Grafana__Secret: "${GRAFANA_OIDC_CLIENT_SECRET:-grafana-dev-secret}"
      Identity__Grafana__RedirectUris: "http://localhost:3001/login/generic_oauth"

  admin-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.AdminApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-admin-api"
      ServiceClient__TokenEndpoint: "http://dcms-identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      ServiceClient__ClientSecret: "dcms-admin-api-dev-secret"
      Services__AiGateway: "http://ai-gateway:8080"
      # The other end of the alert webhook. Unset → the endpoint refuses every request,
      # which is the right way for an unconfigured installation to fail.
      Alerting__WebhookSecret: "${ALERT_WEBHOOK_SECRET:-}"
      Alerting__Recipients: "${ALERT_RECIPIENTS:-}"

  content-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.ContentApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      # The public delivery plane's per-IP rate limit, settable per host.
      #
      # The default is unchanged (600 requests / 60 s, AddDcmsRateLimiting in
      # src/Shared/Dcms.Shared.Hosting/DcmsHostingExtensions.cs). It is parameterised
      # because a load test is, by definition, a single IP: at 600/min any measurement
      # above ~10 req/s stops measuring content-api and starts measuring the limiter, and
      # the run reports 429s as if they were the platform's answer.
      #
      # Raise it for a measurement window and PUT IT BACK. The limiter is a DoS control,
      # and `loadtest/scenarios/ratelimit.js` exists to re-assert that it still bites at
      # whatever value the host keeps -- because a control raised for convenience and
      # never restored is the one nobody checks again.
      #
      # Note it is in-process, so the effective ceiling is PermitLimit x replica count.
      RateLimiting__PermitLimit: "${RATE_LIMIT_PERMITS:-600}"
      RateLimiting__WindowSeconds: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      # AI Chatbot: content-api calls ai-gateway for visitor replies.
      ServiceClient__TokenEndpoint: "http://dcms-identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      ServiceClient__ClientSecret: "dcms-admin-api-dev-secret"
      Services__AiGateway: "http://ai-gateway:8080"
      # Instagram stories. content-api holds no Meta credential -- it asks admin-api, which
      # is the only service granted decrypt on the dcms-social-tokens transit key.
      Services__AdminApi: "http://admin-api:8080"

  media-worker:
    build:
      context: .
      dockerfile: src/Services/Dcms.MediaWorker/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  # The only container that speaks SMTP. Drains the EMAIL work queue — identity and
  # content-api publish rendered messages to it and return immediately, so a slow or
  # unreachable relay costs a retry here instead of a hanging request. Delivery is
  # at-least-once with NAK backoff and dead-lettering (see EmailSendConsumer).
  #
  # Deliberately does NOT inherit *service-env: it needs NATS and the Email:* settings
  # and nothing else — no database, no object storage, no Vault token. Dev defaults
  # point at the Mailpit container, which captures mail without delivering it.
  email-worker:
    build:
      context: .
      dockerfile: src/Services/Dcms.EmailWorker/Dockerfile
    <<: *service-defaults
    # Telemetry only -- deliberately still no *service-env. The relay credentials are the
    # whole point of this service being separate, and they come from Vault.
    environment:
      <<: *otel-env
      Nats__Url: "nats://nats:4222"

  site-builder:
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteBuilder/Dockerfile
    <<: *service-defaults
    # Least privilege: the builder deliberately does NOT get *service-env. It runs a
    # Postgres role scoped to the sites schema and a MinIO service account scoped to
    # the site buckets — never the root storage creds or a Vault token — so a
    # compromised build (or the builder itself) cannot reach other tenants' data or
    # platform secrets. See infra/postgres/init/02-service-roles.sh and infra/minio/init.sh.
    environment:
      # Telemetry only. The least-privilege intent above is untouched: these two variables
      # are an OTLP endpoint and a protocol name, not credentials, and without them this
      # service exports no metrics, traces or logs whatsoever.
      <<: *otel-env
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms_sitebuilder;Password=dcms-sitebuilder-dev"
      ConnectionStrings__Redis: "redis:6379"
      Nats__Url: "nats://nats:4222"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "dcms-sitebuilder"
      Storage__SecretKey: "dcms-sitebuilder-dev"
      # Dev builds run unsandboxed (no gVisor/socket-proxy locally) but still with a
      # fully scrubbed env and --ignore-scripts. Production (prod + vps overlays)
      # sets DCMS_BUILD_SANDBOX_IMAGE + DCMS_BUILD_REQUIRE_SANDBOX so every build
      # runs in an isolated, no-network, cap-dropped ephemeral container instead.
    # Container-wide ceiling; per-build limits are applied to each sandbox container.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  # Image-only build: the ephemeral sandbox that untrusted Mode B builds run inside
  # (node + pnpm/yarn, non-root). It is never started as a long-running service (the
  # profile keeps it out of `up`); it exists so `docker compose` builds and tags the
  # image the site-builder launches throwaway containers from. Build it during deploy:
  #   docker compose --profile sandbox build site-build-sandbox
  site-build-sandbox:
    profiles: ["sandbox"]
    image: dcms/site-build-sandbox:latest
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteBuilder/sandbox.Dockerfile
    entrypoint: ["true"]
    restart: "no"

  site-host:
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteHost/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  # The reverse-proxy edge that is replacing Caddy. In this phase it does routing only and
  # publishes no host port: Caddy still owns :80/:443 and TLS, and forwards a scratch hostname
  # here so the route table can be proved against the real stack before anything is swapped.
  #
  # Deliberately does NOT inherit *service-env, which would hand it the `dcms` OWNER connection
  # string and a MinIO account. The public ingress is the last place to hold credentials it has
  # no use for: it gets the scoped dcms_edge role instead, Redis for ACME challenge tokens, and
  # a Vault grant covering exactly one Transit key. It DOES inherit *otel-env -- that is the
  # distinction site-builder and email-worker got wrong, and it cost two services their entire
  # telemetry signal without a single error.
  edge:
    build:
      context: .
      dockerfile: src/Services/Dcms.Edge/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      vault:
        condition: service_started
    # /health, not /health/live, and that is the whole point of replacing Caddy's probe.
    # Caddy's healthcheck hit its metrics listener, which proved the config parsed and nothing
    # more; a proxy that starts with an empty route table answers every request with a 404 and
    # every signal stays green. RouteTableHealthCheck is registered under `ready`, so only the
    # full endpoint runs it.
    #
    # It also folds in the Postgres and Redis checks, which means a store outage marks the
    # ingress unhealthy while it is still serving every route from the static table. That is
    # the truth worth reporting rather than a false alarm: with Postgres down the edge cannot
    # issue a certificate or pick up a route change. Docker reports it and does not restart it
    # -- restart: unless-stopped acts on exit, not on health -- so the edge keeps proxying.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      <<: *otel-env
      Nats__Url: "nats://nats:4222"
      ConnectionStrings__Redis: "redis:6379"
      # The scoped role from infra/postgres/init/05-edge-role.sh, not the dcms owner. The edge
      # reads and writes the `edge` schema and nothing else -- notably NOT tenancy.domains,
      # which it asks site-host about over HTTP instead.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms_edge;Password=dcms-edge-dev"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dcms-dev-root"
      # The four hostnames DCMS owns. Same values, same defaults and the same reason as the
      # Caddy block: dev and production run the same image, so a name baked into the code
      # would make the dev edge answer for production's.
      Edge__AdminHost: "${ADMIN_HOST:-admin.highgeek.eu}"
      Edge__PlatformHost: "${PLATFORM_HOST:-platform.highgeek.eu}"
      Edge__GrafanaHost: "${GRAFANA_DOMAIN:-grafana.highgeek.eu}"
      Edge__GitHost: "${GIT_HOST:-git.highgeek.eu}"
      # TLS off until the cutover: Caddy still owns :80/:443 and two processes cannot bind the
      # same port. Everything below it is inert while this is false.
      Edge__Certificates__TlsEnabled: "${EDGE_TLS_ENABLED:-false}"
      # STAGING by default, and that is the safety property rather than a placeholder. Let's
      # Encrypt allows ~50 certificates per registered domain per week and counts failed
      # authorizations too, so a dev deployment that inherited production's directory would
      # spend production's budget on throwaway hostnames -- and the symptom is every real
      # tenant's issuance failing at once. Production sets this explicitly.
      Edge__Certificates__AcmeDirectory: "${ACME_DIRECTORY:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      Edge__Certificates__ContactEmail: "${ACME_EMAIL:-}"

  # A throwaway ACME certificate authority, for proving the edge's issuance path without
  # spending a Let's Encrypt rate limit. OFF unless asked for: `--profile acmetest`.
  # See infra/acme-test/README.md for how to drive an issuance through it.
  pebble:
    profiles: ["acmetest"]
    image: ghcr.io/letsencrypt/pebble:v2.6.0
    restart: "no"
    logging: *default-logging
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "127.0.0.11:53"]
    environment:
      # Pebble sleeps a random 0-15s before validating, to shake out clients that assume it is
      # instant. Ours polls, so the delay only makes the test slower.
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./infra/acme-test/pebble-config.json:/test/config/pebble-config.json:ro

  ai-gateway:
    build:
      context: .
      dockerfile: src/Services/Dcms.AiGateway/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-ai-gateway"

  # Truncates a DCMS container's Docker json log file, and nothing else.
  #
  # OFF BY DEFAULT, and that is the design rather than caution. This is the only container in
  # the stack with write access to /var/lib/docker/containers, which is root-owned and close to
  # root on the host. A deployment that does not want that capability should not have to remove
  # anything to be rid of it, so it lives behind a profile and the console reports the feature
  # as unavailable when it is absent. Start it with `--profile logjanitor`.
  #
  # Keep it in proportion before enabling it: the x-logging anchor already caps container logs
  # at 3 x 50 MB each, so this is a convenience under disk pressure, not a leak being plugged.
  #
  # What limits it, beyond the profile: it only ever calls truncate(0); the container must
  # belong to THIS compose project, checked by resolving the name through the READ-ONLY socket
  # proxy and comparing com.docker.compose.project; the path is rebuilt from the resolved id and
  # re-checked to be inside the containers root; and the bearer token is compared in constant
  # time. It runs as root because the log files are root-owned and truncating one needs write
  # permission on it -- every other privilege is dropped here.
  log-janitor:
    profiles: ["logjanitor"]
    build:
      context: .
      dockerfile: infra/log-janitor/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      # No secret in this file. The janitor reads LOG_JANITOR_SECRET from
      # secret/dcms/log-janitor using its own AppRole, exactly as every .NET service does —
      # its policy is the narrowest on the platform: one key, one path, and not even
      # secret/dcms/shared.
      #
      # VAULT_TOKEN is the dev-mode fallback and is empty in production, where the vps overlay
      # supplies the AppRole instead.
      VAULT_ADDR: "${VAULT_ADDR_INTERNAL:-http://vault:8200}"
      VAULT_TOKEN: "${VAULT_DEV_TOKEN:-dcms-dev-root}"
      VAULT_ROLE_ID: ""
      VAULT_SECRET_ID: ""
      COMPOSE_PROJECT: "dcms"
      DOCKER_API: "http://docker-socket-proxy-ro:2375"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # The ONLY writable mount, and the reason this container exists.
      - /var/lib/docker/containers:/var/lib/docker/containers
    depends_on:
      docker-socket-proxy-ro:
        condition: service_started
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    # No published port. Reachable only from the compose network, and only platform-api calls it.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The platform console's API: cross-tenant operations for platform superadmins.
  #
  # Deliberately does NOT inherit *service-env, and the reason is the whole design. This is
  # the service holding the platform's delete buttons -- Loki purges, Prometheus series
  # deletion, container log truncation -- so it runs the least-privilege `dcms_platform`
  # Postgres role, which has SELECT on the `obs` reporting views and read/write on exactly
  # one table (`platform.role_permissions`) and NO grant on identity, tenancy, cms, media or
  # any tenant schema. Users are reached over HTTP from identity, tenants over HTTP from
  # admin-api; each schema stays behind the service that owns it. See
  # infra/postgres/init/04-platform-role.sh.
  #
  # No VAULT_TOKEN and no storage credentials: it holds no secrets of its own today.
  # Audit records ride JetStream (AddDcmsAuditOverNats) because the audit schema is out of
  # this role's reach by construction -- admin-api's writer appends them to the chain.
  #
  # *otel-env is spelled out explicitly. Opting out of *service-env for least privilege is
  # exactly how site-builder and email-worker lost all telemetry silently: the OTEL variables
  # used to live inside that anchor, and a service without them builds its pipelines and
  # exports nothing. That failure is invisible until a dashboard panel reads "No data".
  platform-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.PlatformApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *otel-env
      # ConnectionStrings__Postgres is DELIBERATELY ABSENT here and in every overlay: it
      # carries the dcms_platform password, so it lives in secret/dcms/platform-api and nowhere
      # else. Dev gets it from infra/vault/init.sh; production from `apply.sh --seed`. A value
      # here would also win over Vault, which loads after the environment.
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dcms-dev-root"
      ConnectionStrings__Redis: "redis:6379"
      Nats__Url: "nats://nats:4222"
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-platform-api"
      # Where the console's read-only clients point. All internal: none of these publish a
      # host port in production, so the compose network is the only way to reach them.
      Observability__PrometheusUrl: "http://prometheus:9090"
      Observability__LokiUrl: "http://loki:3100"
      Observability__TempoUrl: "http://tempo:3200"
      Observability__NatsMonitoringUrl: "http://nats:8222"
      Observability__VaultUrl: "http://vault:8200"
      # The URL is not a secret and stays here; the SECRET comes from
      # secret/dcms/platform-api. Empty URL disables container-log truncation in the console,
      # which is the default: the janitor only exists when the `logjanitor` profile is up.
      Observability__LogJanitorUrl: "${LOG_JANITOR_URL:-}"

  platform-spa:
    # 127.0.0.1 rather than localhost for the same reason as admin-spa below: nginx binds IPv4
    # only, while localhost resolves to ::1 first inside the container.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    # Runtime, not build args: the image is environment-agnostic and these are substituted into
    # index.html at container start. DCMS_ENVIRONMENT_NAME is not cosmetic — it drives the band
    # that tells an operator which platform they are about to change.
    environment:
      DCMS_OIDC_AUTHORITY: "http://dcms-identity:8080"
      DCMS_OIDC_CLIENT_ID: "dcms-platform-spa"
      DCMS_ENVIRONMENT_NAME: "development"
      DCMS_ADMIN_BASE: "http://localhost:5000"
      DCMS_GRAFANA_BASE: "http://localhost:3001"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      platform-api:
        condition: service_started
    mem_limit: 32m

  admin-spa:
    # 127.0.0.1 rather than localhost, and that is not pedantry: nginx here is configured
    # `listen 80;` which binds IPv4 only, while localhost resolves to ::1 first inside the
    # container. The probe against localhost fails with "connection refused" on a perfectly
    # healthy container -- a healthcheck that reports a fault it invented itself.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    # Runtime, not a build arg: the image is environment-agnostic and these are substituted
    # into index.html when the container starts. See apps/admin/docker-entrypoint.sh.
    environment:
      DCMS_OIDC_AUTHORITY: "http://dcms-identity:8080"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      admin-api:
        condition: service_started


  # ---------- observability ----------
  #
  # Grafana + Prometheus + Loki + Tempo, fed by a single Alloy agent. Nothing here publishes
  # a host port: Grafana is reached at https://grafana.highgeek.eu through Caddy, and the
  # three stores are reachable only from the compose network. The dev override adds host
  # ports for local work.
  #
  # Every one of these carries a hard mem_limit. vps1 has no swap, so an overrun is an OOM
  # kill rather than a slowdown — and the process the kernel picks is not necessarily the
  # one that overran. An unbounded metrics store can take Postgres with it.

  alloy:
    image: grafana/alloy:v1.19.1
    restart: unless-stopped
    logging: *default-logging
    # 512m, not the 384m the other agents get. Alloy is not one process's worth of work: it
    # is the OTLP receiver, the tail sampler holding up to 20 000 traces in memory, the
    # container-log shipper and five embedded exporters — and cAdvisor alone is the largest
    # of those. Measured at 349 MiB steady on this host, which is 91 % of 384m, and on a
    # swapless box the margin above steady state is the whole safety budget.
    mem_limit: 512m
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Read-only reporting role, same one Grafana's Postgres datasource uses. The exporter
      # needs pg_stat_* views, which are readable by any role — it never touches table data.
      POSTGRES_EXPORTER_USER: "${GRAFANA_DB_USER:-dcms_grafana}"
      POSTGRES_EXPORTER_PASSWORD: "${GRAFANA_DB_PASSWORD:-dcms-grafana-dev}"
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Extra postgres_exporter collectors for views the built-in ones miss on PG 18.
      - ./infra/observability/alloy/postgres-queries.yaml:/etc/alloy/postgres-queries.yaml:ro
      - alloy-data:/var/lib/alloy/data
      # cAdvisor reads cgroup accounting from the host filesystem rather than from the
      # Docker API, so these four are what it actually needs. All read-only. The Docker
      # *API* is reached through docker-socket-proxy-ro instead — mounting the real socket
      # here would hand the log shipper the ability to start a privileged container.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # Written by the store-usage sidecar, read by the node exporter's textfile collector.
      - store-usage:/textfile:ro
    depends_on:
      docker-socket-proxy-ro:
        condition: service_started

  # Read-only half of the socket proxy pattern already used for the build sandbox. POST is
  # off, so this API can list and inspect containers and can start nothing.
  docker-socket-proxy-ro:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    logging: *default-logging
    # 64m: it is a HAProxy in front of a socket and should need almost nothing, but two
    # clients poll it continuously (Alloy's log discovery and its cAdvisor), and it measured
    # at 29 MiB — too close to 32m to leave alone.
    mem_limit: 64m
    privileged: true
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VERSION: "1"
      INFO: "1"
      POST: "0"
      # HAProxy's `option httplog` writes one line PER PROXIED REQUEST at syslog level info,
      # and its two clients poll continuously -- Alloy's log discovery every refresh, and its
      # embedded cAdvisor inspecting every container on every housekeeping pass. On this host
      # that was tens of lines a second of "GET /v1.53/containers/<id>/json 200", forever.
      #
      # Which would be merely ugly if the lines stayed here. They do not: loki.source.docker
      # scrapes every container's stdout, so this one container was the single largest writer
      # into an 8 GB Loki budget -- spending the retention window that exists for the audit
      # anchors and the service logs on a proxy narrating its own health checks.
      #
      # `warning` is the level below info, so the per-request lines stop and everything that
      # is actually worth reading -- a denied method, a backend that will not connect, a
      # config error at startup -- still reaches the log. Quieting a proxy is only safe when
      # its failures are still audible, and at this level they are.
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Measures what the retention budget is written in: bytes on disk, per store.
  #
  # Nothing else does. Prometheus self-reports its TSDB size, but Loki and Tempo do not
  # expose theirs at all, and the dashboards otherwise had only ingest *rates* — from which
  # you can guess at growth but cannot answer "are we inside the 8/8/4 GB budget", which is
  # the only question the budget exists to answer.
  #
  # A compose service rather than a host cron on purpose: a cron entry lives outside the
  # repo and outside anyone's model of the deployment, and survives until the next person
  # rebuilds the host. Mounts every store read-only; the one thing it can write is the
  # textfile directory Alloy reads.
  store-usage:
    image: alpine:3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 16m
    entrypoint: ["sh", "/obs-store-usage.sh"]
    volumes:
      - ./scripts/obs-store-usage.sh:/obs-store-usage.sh:ro
      - store-usage:/textfile
      - prometheus-data:/stores/prometheus:ro
      - loki-data:/stores/loki:ro
      - tempo-data:/stores/tempo:ro
      - grafana-data:/stores/grafana:ro
      - alloy-data:/stores/alloy:ro

  prometheus:
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # No `user:` override, deliberately. These four write through *named* volumes with
    # `o: bind` driver options (see docker-compose.vps.yml), and Docker populates an empty
    # named volume from the image — including the directory's ownership. So each store's
    # data dir ends up owned by that image's own uid, and the image's own uid is the one
    # that can write it. Pinning 1001 here broke exactly that: `permission denied` on
    # /prometheus/queries.active and on mkdir /var/tempo/blocks.
    #
    # This is the opposite of vault and forgejo, which are pinned to 1001 — because those
    # use plain host bind mounts, which Docker neither populates nor chowns. It matches
    # postgres (999), redis (999) and caddy (0), which are already image-uid-owned under
    # /home/cursedhawk/dcms-data. The cost is that removing one of those directories needs
    # root; the alternative was a stack that does not start.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Two caps, not one. Time bounds what the dashboards can ask for; size is the promise
      # to the disk, and it is the one that holds if a cardinality mistake ships.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      # Alloy pushes; without this the remote-write endpoint 404s.
      - --web.enable-remote-write-receiver
      # Series deletion, for the platform console's Storage page. Worth naming what this opens
      # rather than slipping it in: the admin API is delete_series, clean_tombstones AND
      # snapshot, it has no authentication of its own, and Prometheus applies no authorization
      # to it. So the control is entirely that Prometheus publishes no host port in production
      # and only Alloy, Grafana and platform-api can reach it on the compose network — where
      # the console gates the same operations behind platform:logs:purge and audits each one
      # before it runs. Remove this flag and the console reports Prometheus as un-purgeable,
      # which is a supported state rather than a broken one.
      - --web.enable-admin-api
      # Lets prometheus.yml's external_labels read DCMS_HOST / DCMS_ENV below. Without the
      # flag Prometheus takes `${DCMS_HOST}` as a literal label value.
      - --enable-feature=expand-external-labels
    environment:
      # Which deployment this stack's series belong to. See the external_labels comment in
      # prometheus.yml for why the fallback is `unknown` rather than `dev`.
      DCMS_HOST: "${DCMS_HOST:-unknown}"
      DCMS_ENV: "${DCMS_ENV:-unknown}"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.6.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.10.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin-dev}"
      GRAFANA_OIDC_CLIENT_SECRET: "${GRAFANA_OIDC_CLIENT_SECRET:-grafana-dev-secret}"
      GRAFANA_DB_PASSWORD: "${GRAFANA_DB_PASSWORD:-dcms-grafana-dev}"
      # Read by the provisioned contact point, which posts alerts to admin-api. It must be
      # the same string admin-api is given above, or every alert is silently rejected — and
      # a rejected alert looks exactly like having nothing to alert about.
      ALERT_WEBHOOK_SECRET: "${ALERT_WEBHOOK_SECRET:-}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001/}"
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN:-localhost}"
      # Embedding, for the platform console's Monitoring page. Two settings, and BOTH are
      # required — with either one missing the iframe is blank and the browser says why only
      # in the console, which reads as "the console is broken" rather than "Grafana refused".
      #
      #   1. allow_embedding defaults to false, which sends X-Frame-Options: deny.
      #   2. content_security_policy is on in grafana.ini, and its default template ends
      #      frame-ancestors 'self'. This replaces that one directive; everything else in the
      #      template is Grafana's own default, copied verbatim.
      #
      # The default lists the production console AND the two dev origins, because
      # ${PLATFORM_ORIGIN} is interpolated by Compose from the host environment — a value
      # set in another service's `environment:` would not reach it, so there is no way to
      # vary this from the dev override file. Set PLATFORM_ORIGIN in .env to narrow it.
      # Leaving localhost in costs little: framing Grafana from a page on the operator's
      # own machine needs the attacker to already be serving on their localhost.
      #
      # $$NONCE and $$ROOT_PATH are doubled on purpose: they are Grafana's OWN template
      # placeholders, and a single $ would be interpolated away by Compose — leaving a CSP
      # with an empty nonce and a bare ws:// origin, which blocks Grafana's own scripts.
      #
      # Set here rather than in grafana.ini because the host name belongs with the other
      # {$VAR} host configuration, and that file is bind-mounted by both dev and production.
      #
      # Cookies need no change: platform.highgeek.eu and grafana.highgeek.eu share the
      # registrable domain, so the iframe's requests are same-SITE and the existing
      # cookie_samesite=lax session rides along. That stops being true the moment the console
      # moves to a different registrable domain, and the symptom is a silently blank frame.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;
        object-src 'none';
        font-src 'self';
        style-src 'self' 'unsafe-inline' blob:;
        img-src * data:;
        base-uri 'self';
        connect-src 'self' grafana.com ws://$$ROOT_PATH wss://$$ROOT_PATH;
        manifest-src 'self';
        media-src 'none';
        form-action 'self';
        frame-ancestors 'self' ${PLATFORM_ORIGIN:-https://${PLATFORM_HOST:-platform.highgeek.eu} http://localhost:5174 http://localhost:5010};
      # The same two values under their plain names, plus the identity host: grafana.ini
      # reads them with $__env{} for [server] and for the OIDC auth_url the browser is
      # redirected to. GF_* env vars override the ini, so these three exist for the ini's
      # sake -- keeping one source per value rather than a literal in the file and a
      # variable in compose that quietly wins over it.
      GRAFANA_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001/}"
      GRAFANA_DOMAIN: "${GRAFANA_DOMAIN:-localhost}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
    volumes:
      - ./infra/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # NATS monitoring JSON translated to Prometheus. Needs no credentials and no NATS
  # restart, which is why it is here rather than waiting on nats-surveyor: it carries the
  # JetStream dashboards from the first deploy.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    command:
      - -varz
      - -jsz=all
      - -connz
      - -routez
      - -subz
      - -gatewayz
      - -leafz
      - -port=7777
      - http://nats:8222
    depends_on:
      nats:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  forgejo-data:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  # Deliberately NOT bind-mounted under dcms-data in the vps overlay, unlike every other
  # volume here: it holds one file, rewritten every five minutes, and losing it costs one
  # scrape interval. A host directory for that is a host directory to own, chown and back up
  # for no reason.
  store-usage:
