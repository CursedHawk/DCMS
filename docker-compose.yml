name: dcms

x-service-env: &service-env
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms;Password=dcms-dev"
  ConnectionStrings__Redis: "redis:6379"
  Nats__Url: "nats://nats:4222"
  Storage__Endpoint: "minio:9000"
  Storage__AccessKey: "dcms"
  Storage__SecretKey: "dcms-dev-secret"
  VAULT_ADDR: "http://vault:8200"
  VAULT_TOKEN: "dcms-dev-root"

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nats:
      condition: service_started
    minio:
      condition: service_healthy
    vault:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dcms
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: dcms-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms -d dcms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_started
    volumes:
      - ./infra/nats/provision-streams.sh:/provision-streams.sh:ro
    entrypoint: ["sh", "/provision-streams.sh"]
    environment:
      NATS_URL: "nats://nats:4222"

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dcms
      MINIO_ROOT_PASSWORD: dcms-dev-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      MINIO_URL: "http://minio:9000"
      MINIO_ROOT_USER: dcms
      MINIO_ROOT_PASSWORD: dcms-dev-secret

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dcms-dev-root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_started
    volumes:
      - ./infra/vault/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dcms-dev-root"

  mailpit:
    image: axllent/mailpit:latest

  # ---------- application services ----------
  identity:
    build:
      context: .
      dockerfile: src/Services/Dcms.Identity/Dockerfile
    <<: *service-defaults
    # The "dcms-identity" alias is the single issuer hostname used by BOTH the
    # browser (via a 127.0.0.1 hosts entry — see runbook) and the backend
    # services (internal DNS), so token issuer / jwks_uri resolve identically.
    networks:
      default:
        aliases:
          - dcms-identity
    environment:
      <<: *service-env
      Identity__Issuer: "http://dcms-identity:8080/"
      Identity__AllowInsecureHttp: "true"
      Identity__Spa__RedirectUris: "http://localhost:5173/auth/callback;http://localhost:5000/auth/callback"
      Identity__Spa__PostLogoutUris: "http://localhost:5173/;http://localhost:5000/"

  admin-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.AdminApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-admin-api"
      ServiceClient__TokenEndpoint: "http://dcms-identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      ServiceClient__ClientSecret: "dcms-admin-api-dev-secret"
      Services__AiGateway: "http://ai-gateway:8080"

  content-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.ContentApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  media-worker:
    build:
      context: .
      dockerfile: src/Services/Dcms.MediaWorker/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  site-builder:
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteBuilder/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  site-host:
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteHost/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  ai-gateway:
    build:
      context: .
      dockerfile: src/Services/Dcms.AiGateway/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-ai-gateway"

  admin-spa:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: "http://dcms-identity:8080"
    restart: unless-stopped
    depends_on:
      admin-api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
