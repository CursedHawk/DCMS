name: dcms

# Docker's json-file driver is unbounded by default. Nothing rotated these until now, and
# the host has already needed a container log deleted by hand under disk pressure. 3x50MB
# per container caps the whole stack at well under a gigabyte, and Loki holds the searchable
# copy anyway — these files are only the last few minutes before Alloy picks them up.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-service-env: &service-env
  # Turns the OpenTelemetry export on. AddDcmsServiceDefaults builds the tracer, meter and
  # log pipelines unconditionally but only attaches an exporter when this is set, so an
  # unset value means "collect nothing, cost nothing" for a bare `dotnet run`.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms;Password=dcms-dev"
  ConnectionStrings__Redis: "redis:6379"
  Nats__Url: "nats://nats:4222"
  Storage__Endpoint: "minio:9000"
  Storage__AccessKey: "dcms"
  Storage__SecretKey: "dcms-dev-secret"
  VAULT_ADDR: "http://vault:8200"
  VAULT_TOKEN: "dcms-dev-root"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nats:
      condition: service_started
    minio:
      condition: service_healthy
    vault:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:18
    logging: *default-logging
    environment:
      POSTGRES_DB: dcms
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: dcms-dev
    volumes:
      # postgres:18 stores data in a major-version subdirectory and expects the
      # volume mounted at /var/lib/postgresql (not /var/lib/postgresql/data).
      # See https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms -d dcms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11
    logging: *default-logging
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_started
    volumes:
      - ./infra/nats/provision-streams.sh:/provision-streams.sh:ro
    entrypoint: ["sh", "/provision-streams.sh"]
    environment:
      NATS_URL: "nats://nats:4222"

  minio:
    image: minio/minio:latest
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dcms
      MINIO_ROOT_PASSWORD: dcms-dev-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      MINIO_URL: "http://minio:9000"
      MINIO_ROOT_USER: dcms
      MINIO_ROOT_PASSWORD: dcms-dev-secret

  vault:
    image: hashicorp/vault:latest
    logging: *default-logging
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dcms-dev-root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_started
    volumes:
      - ./infra/vault/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dcms-dev-root"

  mailpit:
    image: axllent/mailpit:latest
    logging: *default-logging

  # Self-hosted git server (Gitea community fork). Source of truth for Mode B
  # (ReactApp) site source: one repo per site, edited in the web IDE and cloneable
  # over HTTP/SSH with the git CLI. Metadata lives in an embedded SQLite DB inside
  # the data volume; the git repositories live under /data/git. A push to a site's
  # default branch fires a webhook back to admin-api to trigger the offline build.
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    logging: *default-logging
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: "sqlite3"
      FORGEJO__server__DOMAIN: "localhost"
      FORGEJO__server__ROOT_URL: "http://localhost:3000/"
      FORGEJO__server__HTTP_PORT: "3000"
      # Git SSH: use the image's built-in openssh (listens on container :22). The
      # advertised clone port is 2222 (host), published as 2222 -> 22 below, so
      # clone URLs read git@git.highgeek.eu:2222. (Don't run Forgejo's own SSH
      # server — it conflicts with the container's openssh.)
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      # No public web installer: the server is provisioned headless (secrets are
      # auto-generated on first boot when install is locked) and the first admin
      # is created out-of-band via the CLI. Self-registration stays off so only
      # platform-provisioned accounts exist.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      # Webhooks target admin-api on the internal docker network (a private host),
      # which Forgejo's SSRF guard blocks by default — allow the internal range.
      FORGEJO__webhook__ALLOWED_HOST_LIST: "private,loopback"
    volumes:
      - forgejo-data:/data
    ports:
      # HTTP/web UI on loopback only — in prod Caddy proxies it over the internal
      # network and terminates TLS; in dev the developer reaches it at localhost.
      - "127.0.0.1:3000:3000"
      # Git SSH is published on all interfaces so `git clone ssh://…:2222` works
      # from outside the host (host 2222 -> container openssh on 22).
      - "2222:22"

  # ---------- application services ----------
  identity:
    build:
      context: .
      dockerfile: src/Services/Dcms.Identity/Dockerfile
    <<: *service-defaults
    # The "dcms-identity" alias is the single issuer hostname used by BOTH the
    # browser (via a 127.0.0.1 hosts entry — see runbook) and the backend
    # services (internal DNS), so token issuer / jwks_uri resolve identically.
    networks:
      default:
        aliases:
          - dcms-identity
    environment:
      <<: *service-env
      Identity__Issuer: "http://dcms-identity:8080/"
      Identity__AllowInsecureHttp: "true"
      Identity__Spa__RedirectUris: "http://localhost:5173/auth/callback;http://localhost:5000/auth/callback"
      Identity__Spa__PostLogoutUris: "http://localhost:5173/;http://localhost:5000/"
      # Grafana SSO against the dev stack, where Grafana is published on 3001.
      Identity__Grafana__Secret: "${GRAFANA_OIDC_CLIENT_SECRET:-grafana-dev-secret}"
      Identity__Grafana__RedirectUris: "http://localhost:3001/login/generic_oauth"

  admin-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.AdminApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-admin-api"
      ServiceClient__TokenEndpoint: "http://dcms-identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      ServiceClient__ClientSecret: "dcms-admin-api-dev-secret"
      Services__AiGateway: "http://ai-gateway:8080"
      # The other end of the alert webhook. Unset → the endpoint refuses every request,
      # which is the right way for an unconfigured installation to fail.
      Alerting__WebhookSecret: "${ALERT_WEBHOOK_SECRET:-}"
      Alerting__Recipients: "${ALERT_RECIPIENTS:-}"

  content-api:
    build:
      context: .
      dockerfile: src/Services/Dcms.ContentApi/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      # AI Chatbot: content-api calls ai-gateway for visitor replies.
      ServiceClient__TokenEndpoint: "http://dcms-identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      ServiceClient__ClientSecret: "dcms-admin-api-dev-secret"
      Services__AiGateway: "http://ai-gateway:8080"

  media-worker:
    build:
      context: .
      dockerfile: src/Services/Dcms.MediaWorker/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  # The only container that speaks SMTP. Drains the EMAIL work queue — identity and
  # content-api publish rendered messages to it and return immediately, so a slow or
  # unreachable relay costs a retry here instead of a hanging request. Delivery is
  # at-least-once with NAK backoff and dead-lettering (see EmailSendConsumer).
  #
  # Deliberately does NOT inherit *service-env: it needs NATS and the Email:* settings
  # and nothing else — no database, no object storage, no Vault token. Dev defaults
  # point at the Mailpit container, which captures mail without delivering it.
  email-worker:
    build:
      context: .
      dockerfile: src/Services/Dcms.EmailWorker/Dockerfile
    <<: *service-defaults
    environment:
      Nats__Url: "nats://nats:4222"

  site-builder:
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteBuilder/Dockerfile
    <<: *service-defaults
    # Least privilege: the builder deliberately does NOT get *service-env. It runs a
    # Postgres role scoped to the sites schema and a MinIO service account scoped to
    # the site buckets — never the root storage creds or a Vault token — so a
    # compromised build (or the builder itself) cannot reach other tenants' data or
    # platform secrets. See infra/postgres/init/02-service-roles.sh and infra/minio/init.sh.
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms_sitebuilder;Password=dcms-sitebuilder-dev"
      ConnectionStrings__Redis: "redis:6379"
      Nats__Url: "nats://nats:4222"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "dcms-sitebuilder"
      Storage__SecretKey: "dcms-sitebuilder-dev"
      # Dev builds run unsandboxed (no gVisor/socket-proxy locally) but still with a
      # fully scrubbed env and --ignore-scripts. Production (prod + vps overlays)
      # sets DCMS_BUILD_SANDBOX_IMAGE + DCMS_BUILD_REQUIRE_SANDBOX so every build
      # runs in an isolated, no-network, cap-dropped ephemeral container instead.
    # Container-wide ceiling; per-build limits are applied to each sandbox container.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  # Image-only build: the ephemeral sandbox that untrusted Mode B builds run inside
  # (node + pnpm/yarn, non-root). It is never started as a long-running service (the
  # profile keeps it out of `up`); it exists so `docker compose` builds and tags the
  # image the site-builder launches throwaway containers from. Build it during deploy:
  #   docker compose --profile sandbox build site-build-sandbox
  site-build-sandbox:
    profiles: ["sandbox"]
    image: dcms/site-build-sandbox:latest
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteBuilder/sandbox.Dockerfile
    entrypoint: ["true"]
    restart: "no"

  site-host:
    build:
      context: .
      dockerfile: src/Services/Dcms.SiteHost/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env

  ai-gateway:
    build:
      context: .
      dockerfile: src/Services/Dcms.AiGateway/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      Auth__Authority: "http://dcms-identity:8080/"
      Auth__Audience: "dcms-ai-gateway"

  admin-spa:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: "http://dcms-identity:8080"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      admin-api:
        condition: service_started


  # ---------- observability ----------
  #
  # Grafana + Prometheus + Loki + Tempo, fed by a single Alloy agent. Nothing here publishes
  # a host port: Grafana is reached at https://grafana.highgeek.eu through Caddy, and the
  # three stores are reachable only from the compose network. The dev override adds host
  # ports for local work.
  #
  # Every one of these carries a hard mem_limit. vps1 has no swap, so an overrun is an OOM
  # kill rather than a slowdown — and the process the kernel picks is not necessarily the
  # one that overran. An unbounded metrics store can take Postgres with it.

  alloy:
    image: grafana/alloy:v1.19.1
    restart: unless-stopped
    logging: *default-logging
    # 512m, not the 384m the other agents get. Alloy is not one process's worth of work: it
    # is the OTLP receiver, the tail sampler holding up to 20 000 traces in memory, the
    # container-log shipper and five embedded exporters — and cAdvisor alone is the largest
    # of those. Measured at 349 MiB steady on this host, which is 91 % of 384m, and on a
    # swapless box the margin above steady state is the whole safety budget.
    mem_limit: 512m
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Read-only reporting role, same one Grafana's Postgres datasource uses. The exporter
      # needs pg_stat_* views, which are readable by any role — it never touches table data.
      POSTGRES_EXPORTER_USER: "${GRAFANA_DB_USER:-dcms_grafana}"
      POSTGRES_EXPORTER_PASSWORD: "${GRAFANA_DB_PASSWORD:-dcms-grafana-dev}"
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # cAdvisor reads cgroup accounting from the host filesystem rather than from the
      # Docker API, so these four are what it actually needs. All read-only. The Docker
      # *API* is reached through docker-socket-proxy-ro instead — mounting the real socket
      # here would hand the log shipper the ability to start a privileged container.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # Written by the store-usage sidecar, read by the node exporter's textfile collector.
      - store-usage:/textfile:ro
    depends_on:
      docker-socket-proxy-ro:
        condition: service_started

  # Read-only half of the socket proxy pattern already used for the build sandbox. POST is
  # off, so this API can list and inspect containers and can start nothing.
  docker-socket-proxy-ro:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    logging: *default-logging
    # 64m: it is a HAProxy in front of a socket and should need almost nothing, but two
    # clients poll it continuously (Alloy's log discovery and its cAdvisor), and it measured
    # at 29 MiB — too close to 32m to leave alone.
    mem_limit: 64m
    privileged: true
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VERSION: "1"
      INFO: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Measures what the retention budget is written in: bytes on disk, per store.
  #
  # Nothing else does. Prometheus self-reports its TSDB size, but Loki and Tempo do not
  # expose theirs at all, and the dashboards otherwise had only ingest *rates* — from which
  # you can guess at growth but cannot answer "are we inside the 8/8/4 GB budget", which is
  # the only question the budget exists to answer.
  #
  # A compose service rather than a host cron on purpose: a cron entry lives outside the
  # repo and outside anyone's model of the deployment, and survives until the next person
  # rebuilds the host. Mounts every store read-only; the one thing it can write is the
  # textfile directory Alloy reads.
  store-usage:
    image: alpine:3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 16m
    entrypoint: ["sh", "/obs-store-usage.sh"]
    volumes:
      - ./scripts/obs-store-usage.sh:/obs-store-usage.sh:ro
      - store-usage:/textfile
      - prometheus-data:/stores/prometheus:ro
      - loki-data:/stores/loki:ro
      - tempo-data:/stores/tempo:ro
      - grafana-data:/stores/grafana:ro
      - alloy-data:/stores/alloy:ro

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # No `user:` override, deliberately. These four write through *named* volumes with
    # `o: bind` driver options (see docker-compose.vps.yml), and Docker populates an empty
    # named volume from the image — including the directory's ownership. So each store's
    # data dir ends up owned by that image's own uid, and the image's own uid is the one
    # that can write it. Pinning 1001 here broke exactly that: `permission denied` on
    # /prometheus/queries.active and on mkdir /var/tempo/blocks.
    #
    # This is the opposite of vault and forgejo, which are pinned to 1001 — because those
    # use plain host bind mounts, which Docker neither populates nor chowns. It matches
    # postgres (999), redis (999) and caddy (0), which are already image-uid-owned under
    # /home/cursedhawk/dcms-data. The cost is that removing one of those directories needs
    # root; the alternative was a stack that does not start.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Two caps, not one. Time bounds what the dashboards can ask for; size is the promise
      # to the disk, and it is the one that holds if a cardinality mistake ships.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      # Alloy pushes; without this the remote-write endpoint 404s.
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.6.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.10.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin-dev}"
      GRAFANA_OIDC_CLIENT_SECRET: "${GRAFANA_OIDC_CLIENT_SECRET:-grafana-dev-secret}"
      GRAFANA_DB_PASSWORD: "${GRAFANA_DB_PASSWORD:-dcms-grafana-dev}"
      # Read by the provisioned contact point, which posts alerts to admin-api. It must be
      # the same string admin-api is given above, or every alert is silently rejected — and
      # a rejected alert looks exactly like having nothing to alert about.
      ALERT_WEBHOOK_SECRET: "${ALERT_WEBHOOK_SECRET:-}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001/}"
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN:-localhost}"
    volumes:
      - ./infra/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # NATS monitoring JSON translated to Prometheus. Needs no credentials and no NATS
  # restart, which is why it is here rather than waiting on nats-surveyor: it carries the
  # JetStream dashboards from the first deploy.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    command:
      - -varz
      - -jsz=all
      - -connz
      - -routez
      - -subz
      - -gatewayz
      - -leafz
      - -port=7777
      - http://nats:8222
    depends_on:
      nats:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  forgejo-data:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  # Deliberately NOT bind-mounted under dcms-data in the vps overlay, unlike every other
  # volume here: it holds one file, rewritten every five minutes, and losing it costs one
  # scrape interval. A host directory for that is a host directory to own, chown and back up
  # for no reason.
  store-usage:
