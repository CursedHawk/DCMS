<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      An explicit icon, inlined as a data URI so it costs no request.

      Without it the browser falls back to requesting /favicon.ico, which the SPA
      fallback answers with index.html — not an image, so the browser never caches
      the result and re-requests it whenever the document URL changes. Scalar
      rewrites the URL as you scroll the API docs, which turned that into a
      request per scroll step.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230f172a%22%2F%3E%3Cpath%20d%3D%22M10%208h6.2c4.9%200%208.3%203.2%208.3%208s-3.4%208-8.3%208H10V8Zm4.4%203.6v8.8h1.6c2.6%200%204.2-1.7%204.2-4.4s-1.6-4.4-4.2-4.4h-1.6Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E" />
    <title>DCMS Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
