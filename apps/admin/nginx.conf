server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (SEC-11). frame-ancestors/X-Frame-Options stop the console being framed
    # for clickjacking; nosniff and Referrer-Policy are safe hardening. A full script/connect-src
    # CSP is deliberately not set here because those hosts are runtime-configured — add it once
    # validated against the running SPA.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA ships an inline <link rel="icon">, so nothing should ask for this.
    # Anything that still does (a bookmark, a crawler, a browser ignoring the
    # inline icon) must not fall through to index.html: an HTML body for an image
    # request is never cached, so the browser re-asks on every URL change.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxied to admin-api inside the compose network
    location /api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
