# The scheme the person used: the edge terminates TLS and says so; anything else is not one.
map $http_x_forwarded_proto $dcms_scheme {
    ~^https?$ $http_x_forwarded_proto;
    default   $scheme;
}

# The host as asked for, port included ($host drops it); the edge only routes hosts it serves.
map $http_host $dcms_host {
    ""      $host;
    default $http_host;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (SEC-11). frame-ancestors/X-Frame-Options stop the console being framed
    # for clickjacking; nosniff and Referrer-Policy are safe hardening. A full script/connect-src
    # CSP is deliberately not set here because those hosts are runtime-configured — add it once
    # validated against the running SPA.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA ships an inline <link rel="icon">, so nothing should ask for this.
    # Anything that still does (a bookmark, a crawler, a browser ignoring the
    # inline icon) must not fall through to index.html: an HTML body for an image
    # request is never cached, so the browser re-asks on every URL change.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # The C# language service (ADR 0030): ~17 MB gzipped, fetched once per release. Its names are
    # stable (not fingerprinted), so the browser revalidates by ETag. A location's add_header
    # replaces the server's, so nosniff is repeated: these are scripts.
    location /csharp/ {
        gzip_static on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The dcms command line (ADR 0032): one file per platform, SHA256SUMS, version, and the
    # installers. A file or a 404, never the SPA's index.html.
    #
    # The installers say which console they came from, so the one-liner needs no address twice:
    # the edge keeps the public Host (AddOriginalHost) and says the scheme in X-Forwarded-Proto.
    location ~ ^/downloads/install\.(sh|ps1)$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        sub_filter_types text/plain;
        sub_filter_once off;
        sub_filter '__DCMS_ORIGIN__' '$dcms_scheme://$dcms_host';
        try_files $uri =404;
    }

    location /downloads/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxied to admin-api inside the compose network
    location /api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
