# Hashed bundles never change under a name; the HTML must be revalidated so a deploy shows up.
map $uri $landing_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Redirects stay relative: behind the edge, nginx does not know the public scheme or port.
  absolute_redirect off;

  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $landing_cache_control always;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Not an SPA fallback: every page is prerendered, so an unknown path is a real 404 with a
  # real 404 status — a soft 404 (200 + index.html) is what search engines penalise.
  error_page 404 /404.html;

  location = / {
    try_files /index.html =404;
  }

  # One URL per page: /terms-of-service/ and /terms-of-service.html redirect to the canonical form.
  #
  # Only plain slugs are redirected, because the Location is built from the request: a capture
  # of `.+` turned /%5Cevil.com/ into `Location: /\evil.com`, which browsers read as
  # //evil.com — an open redirect. Every real page is a slug; anything else falls to the 404.
  location ~ ^/([a-z0-9-]+)/$ {
    return 301 /$1$is_args$args;
  }
  location ~ ^/([a-z0-9-]+)\.html$ {
    return 301 /$1$is_args$args;
  }
  location = /index.html {
    return 301 /;
  }
  # Only reachable as error_page's target, so the redirect above cannot swallow it.
  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri.html =404;
  }
}
