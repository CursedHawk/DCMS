server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

    # Security headers (SEC-11). frame-ancestors/X-Frame-Options stop the console being framed
    # for clickjacking; nosniff and Referrer-Policy are safe hardening. A full script/connect-src
    # CSP is deliberately not set here because those hosts are runtime-configured — add it once
    # validated against the running SPA.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA fallback: every route is client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Answered here rather than falling through to index.html. A favicon request that returns an
  # HTML document is never cached, so the browser re-requests it on every URL change.
  location = /favicon.ico { return 204; }
}
