# Production profile overlay. Use WITHOUT the dev override:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   * Caddy terminates TLS for tenant custom domains (on-demand TLS, gated by
#     site-host's /internal/tls-allowed) and is the only public ingress.
#   * Vault runs in real server mode (file storage, no dev root token); the app
#     refuses to start against a dev token (DCMS_REFUSE_DEV_VAULT=true).
#   * All secrets come from the host environment (POSTGRES_PASSWORD, MINIO_*,
#     VAULT_TOKEN, service client secrets) — no dev defaults baked in.
#   * Services run in the Production environment with HTTPS metadata required.
#
# Required env (e.g. via a .env file next to this compose):
#   POSTGRES_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, ACME_EMAIL, PUBLIC_BASE_URL
#
# Application secrets are NOT in that list any more. Everything only a .NET service
# reads — the audit chain key, service client secrets, Forgejo tokens, SMTP credentials,
# the identity certificates — comes from Vault, per service, over that service's own
# AppRole. What remains in .env is what a container that cannot speak to Vault needs in
# order to start at all: Postgres, MinIO, NATS, Grafana, Caddy. See docs/vault-secrets.md.

x-prod-env: &prod-env
  ASPNETCORE_ENVIRONMENT: "Production"
  DOTNET_ENVIRONMENT: "Production"
  DCMS_REFUSE_DEV_VAULT: "true"
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms;Password=${POSTGRES_PASSWORD}"
  ConnectionStrings__Redis: "redis:6379"
  Nats__Url: "nats://nats:4222"
  Storage__Endpoint: "minio:9000"
  Storage__AccessKey: "${MINIO_ROOT_USER}"
  Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
  VAULT_ADDR: "http://vault:8200"
  # Two auth paths, and AppRole wins when both halves are present -- which is what lets this
  # deployment migrate one service at a time rather than in a single cutover.
  #
  # The static token is the legacy path: ONE 72-hour periodic token shared by every service,
  # with read on secret/data/dcms/*. It expires (nothing renews it, and the failure is
  # invisible until the next restart), and it gives every container every secret the platform
  # holds. Per-service AppRoles fix both: each service logs in itself for a short-lived token
  # scoped to its own path, so there is nothing to renew and nothing shared.
  #
  # Per-service ids are layered on in docker-compose.vps.yml, where a host's own credentials
  # belong. Anything without them falls back to the token below.
  VAULT_TOKEN: "${VAULT_TOKEN:-}"
  #
  # Audit__ChainKey is NOT here any more. It lives in Vault, in the six per-service
  # paths of the services that own the audit schema — deliberately not in
  # secret/dcms/shared, which email-worker and site-builder can also read and which
  # would hand them a key they reach the audit log over NATS precisely to avoid
  # holding.
  #
  # It was an anchor entry, and that was the problem: one .env value reached every
  # service that merged the anchor, which is the shape this migration exists to end.
  # A service now gets the key from its own Vault path or does not start.
  #
  # The key MUST still be stable forever — rotating it makes every previously written
  # record fail verification, which reads exactly like tampering. See
  # docs/adr/0007-audit-logging.md and docs/vault-secrets.md.

services:
  postgres:
    # pg_stat_statements is what turns "the database is slow" into "this statement is slow".
    # It must be preloaded at startup — it cannot be enabled on a running server — so this
    # costs one Postgres restart, once.
    #
    # track_io_timing makes the read/write time columns real rather than zero, which is the
    # difference between knowing a query is slow and knowing whether it is slow on disk.
    #
    # For CDC later, add: -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    # Deliberately not set now. It raises WAL volume on a disk-constrained host for no
    # benefit until something is actually reading a replication slot, and turning it on is
    # the same one-restart cost then as it is now. See docs/adr/0008-observability.md.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: dcms
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Password for the least-privilege builder role, created by
      # infra/postgres/init/02-service-roles.sh on first init. On an already-initialised
      # cluster the script does not re-run — provision the role manually (see runbook).
      SITEBUILDER_DB_PASSWORD: "${SITEBUILDER_DB_PASSWORD:-dcms-sitebuilder-dev}"

  minio:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      # Lets Alloy scrape /minio/v2/metrics/cluster without a bearer token. "public" here
      # means "no auth on the metrics path", not "exposed publicly": MinIO publishes no host
      # port, so the compose network is the only place this is reachable from. The
      # alternative is minting a JWT with the root credentials and rotating it, which puts
      # the root key in a second place to protect an endpoint that reports bucket sizes.
      MINIO_PROMETHEUS_AUTH_TYPE: "public"

  # Real Vault server (sealed on first boot; operator runs init + unseal).
  vault:
    # -config points at the DIRECTORY, not a single file. Vault merges every .hcl in it, which
    # is what lets a host enable Transit auto-unseal by dropping in seal-transit.hcl without
    # editing the shared config. See infra/vault/server/seal-transit.hcl -- and note that a
    # Shamir-sealed Vault means the platform cannot return from a reboot without a human.
    command: ["vault", "server", "-config=/vault/config"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      VAULT_ADDR: "http://0.0.0.0:8200"
      # Read by the seal stanza. Kept out of the mounted file so the token is not on disk in
      # the repo directory.
      # The transit seal's TOKEN, like its address, is read from the standard client variable
      # VAULT_TOKEN -- not from VAULT_TRANSIT_SEAL_TOKEN, which Vault ignores entirely. It
      # fails in the least helpful way possible: the request reaches the seal Vault with no
      # token at all and comes back 403 "permission denied", which reads like a policy problem
      # and sent us to audit the policy, the token's TTL and its CIDR bindings first. The
      # seal Vault's audit log is what settled it -- `"policies": null` on the denied request.
      #
      # Kept under the descriptive name in .env, and mapped here.
      VAULT_TOKEN: "${VAULT_TRANSIT_SEAL_TOKEN:-}"
      # Which Transit key on the seal Vault unwraps THIS host's master key. The one value that
      # differs between dev and production -- the rest of the seal config is committed in
      # infra/vault/server/seal-transit.hcl, which both environments share.
      #
      # No default on purpose. A wrong key name is not a startup error you can miss: Vault
      # refuses to start at all, which is the right failure. A default would let a production
      # host silently seal itself against the dev key.
      VAULT_TRANSIT_SEAL_KEY_NAME: "${VAULT_TRANSIT_SEAL_KEY_NAME:-}"
    volumes:
      - ./infra/vault/server:/vault/config:ro
      - vault-data:/vault/data

  # The dev seeding job is a no-op in prod; secrets are provisioned by the operator.
  vault-init:
    entrypoint: ["/bin/true"]
    environment:
      VAULT_TOKEN: ""

  # ---------- cluster bootstrap ----------
  # Real credentials for the three non-owner roles. RLS_DB_PASSWORD in particular matters:
  # 01-rls.sql hardcodes a development password because initdb cannot pass it one, and a
  # production cluster must not keep a role with SELECT on every tenant schema on a password
  # published in this repository.
  postgres-bootstrap:
    environment:
      PGHOST: postgres
      POSTGRES_USER: dcms
      POSTGRES_DB: dcms
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      SITEBUILDER_DB_PASSWORD: "${SITEBUILDER_DB_PASSWORD}"
      EDGE_DB_PASSWORD: "${EDGE_DB_PASSWORD:-dcms-edge-dev}"
      GRAFANA_DB_PASSWORD: "${GRAFANA_DB_PASSWORD}"
      RLS_DB_PASSWORD: "${RLS_DB_PASSWORD:-}"

  # ---------- schema migration jobs ----------
  # These are the only containers in production allowed to run DDL. `scripts/deploy.sh`
  # runs them before rolling anything; every service below has its own migrate flag off.
  migrate:
    environment:
      <<: *prod-env

  identity-migrate:
    environment:
      <<: *prod-env
      Identity__Issuer: "${PUBLIC_BASE_URL}/"
      Identity__AllowInsecureHttp: "false"
      Identity__AllowEphemeralKeys: "${IDENTITY_ALLOW_EPHEMERAL_KEYS:-false}"

  identity:
    environment:
      <<: *prod-env
      # The console is served from its own host but signs in against THIS issuer, so its
      # discovery, token and userinfo calls are cross-origin and need naming here. It went in
      # on content-api by mistake first: the console's sign-in failed at the very first fetch
      # with no Access-Control-Allow-Origin, which is a confusing way to learn that the wrong
      # service was told about it.
      Cors__AllowedOrigins__0: "${PUBLIC_BASE_URL}"
      Cors__AllowedOrigins__1: "https://${PLATFORM_HOST:-platform.highgeek.eu}"
      # Blanked, not omitted. The base file lists the two localhost dev origins, and compose
      # MERGES environment maps -- so without these a production identity would keep accepting
      # credentialed cross-origin requests from anything served on an operator's own machine.
      Cors__AllowedOrigins__2: ""
      Cors__AllowedOrigins__3: ""
      Identity__Issuer: "${PUBLIC_BASE_URL}/"
      Identity__AllowInsecureHttp: "false"
      # Migration and seeding are the migration job's work. Left on, every replica
      # would run DDL and seed concurrently at startup.
      Identity__Migrate: "false"
      Identity__Seed: "false"
      # Persisted OIDC keys come from secret/dcms/identity. Without them OpenIddict mints
      # per-container keys, so each replica publishes a different JWKS and every deploy
      # invalidates every live token. Identity refuses to start in Production without them
      # unless IDENTITY_ALLOW_EPHEMERAL_KEYS=true, which accepts both consequences.
      #
      # Identity__CertificatePassword is deliberately absent rather than empty: these were
      # exported with no password, and X509CertificateLoader treats absent and empty alike.
      # Set it in the Vault path if a future .pfx has an export password.
      Identity__AllowEphemeralKeys: "${IDENTITY_ALLOW_EPHEMERAL_KEYS:-false}"

  admin-api:
    environment:
      <<: *prod-env
      Auth__Authority: "http://identity:8080/"
      Auth__RequireHttpsMetadata: "true"
      ServiceClient__TokenEndpoint: "http://identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      # ServiceClient__ClientSecret is read from this service's own Vault path. Blanked
      # rather than omitted: the BASE compose sets a dev secret published in this
      # repository, and with the override gone that value would otherwise survive into a
      # production container. Vault loads after the environment, so the real secret still
      # wins; what this removes is the fallback that would quietly take its place.
      ServiceClient__ClientSecret: ""
      Services__AiGateway: "http://ai-gateway:8080"
      # DDL belongs to the migration job. The RLS coverage assertion still runs at every
      # startup -- it reads no database and it is what catches a tenant table added
      # without a policy.
      Tenancy__Migrate: "false"

  content-api:
    environment:
      <<: *prod-env
      Auth__Authority: "http://identity:8080/"
      Auth__RequireHttpsMetadata: "true"
      Cors__AllowedOrigins__0: "${PUBLIC_BASE_URL}"
      # AI Chatbot: content-api calls ai-gateway for visitor replies, reusing the
      # shared dcms.ai service client (same secret as admin-api).
      ServiceClient__TokenEndpoint: "http://identity:8080/connect/token"
      ServiceClient__ClientId: "dcms-admin-api"
      # ServiceClient__ClientSecret is read from this service's own Vault path. Blanked
      # rather than omitted: the BASE compose sets a dev secret published in this
      # repository, and with the override gone that value would otherwise survive into a
      # production container. Vault loads after the environment, so the real secret still
      # wins; what this removes is the fallback that would quietly take its place.
      ServiceClient__ClientSecret: ""
      Services__AiGateway: "http://ai-gateway:8080"
      # Instagram stories: content-api asks admin-api rather than holding a Meta token, which
      # is what keeps decrypt on dcms-social-tokens off the internet-facing service.
      Services__AdminApi: "http://admin-api:8080"

  media-worker:
    environment:
      <<: *prod-env

  # Like the site-builder, email-worker deliberately does NOT inherit *prod-env: the
  # mail relay is all it needs to reach. Host-specific SMTP settings are layered on
  # by the vps overlay (x-vps-email).
  email-worker:
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # VAULT_ADDR, without inheriting *prod-env.
      #
      # This service deliberately does not merge that anchor -- it reaches the audit log over
      # NATS and must not hold the audit chain key. But VAULT_ADDR lives in the same anchor,
      # so skipping it also removed the one variable that makes Vault reachable, and
      # VaultCredentials.FromEnvironment returns null with no address. The result was a
      # service that calls AddDcmsVault through AddDcmsServiceDefaults, is handed AppRole
      # credentials by the vps overlay, and silently reads no configuration from Vault at all.
      # Harmless while Vault holds only placeholders; invisible once it holds real secrets.
      VAULT_ADDR: "http://vault:8200"
      DOTNET_ENVIRONMENT: "Production"
      Nats__Url: "nats://nats:4222"

  # The site-builder deliberately does NOT inherit *prod-env (no root MinIO creds,
  # no Vault token, no broad DB user). It gets least-privilege scoped credentials
  # and runs every untrusted build in an isolated sandbox container launched over a
  # restricted Docker API (docker-socket-proxy), never in this process.
  site-builder:
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # VAULT_ADDR, without inheriting *prod-env.
      #
      # This service deliberately does not merge that anchor -- it reaches the audit log over
      # NATS and must not hold the audit chain key. But VAULT_ADDR lives in the same anchor,
      # so skipping it also removed the one variable that makes Vault reachable, and
      # VaultCredentials.FromEnvironment returns null with no address. The result was a
      # service that calls AddDcmsVault through AddDcmsServiceDefaults, is handed AppRole
      # credentials by the vps overlay, and silently reads no configuration from Vault at all.
      # Harmless while Vault holds only placeholders; invisible once it holds real secrets.
      VAULT_ADDR: "http://vault:8200"
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms_sitebuilder;Password=${SITEBUILDER_DB_PASSWORD:-dcms-sitebuilder-dev}"
      ConnectionStrings__Redis: "redis:6379"
      Nats__Url: "nats://nats:4222"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "${SITEBUILDER_MINIO_USER:-dcms-sitebuilder}"
      Storage__SecretKey: "${SITEBUILDER_MINIO_PASSWORD:-dcms-sitebuilder-dev}"
      # Probe a bucket this key is allowed to see. The default is dcms-media, which the
      # sitebuilder policy deliberately excludes, so the check answered AccessDenied and
      # /health was Unhealthy for as long as this service has existed.
      Storage__HealthBucket: "dcms-sites"
      # Sandbox each untrusted build. WORK_HOST_ROOT (the host path backing
      # /var/build-work) is host-specific and set in the vps overlay; without it the
      # builder refuses to run (DCMS_BUILD_REQUIRE_SANDBOX) rather than run unsafely.
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      DCMS_BUILD_SANDBOX_IMAGE: "dcms/site-build-sandbox:latest"
      DCMS_BUILD_REQUIRE_SANDBOX: "true"
      DCMS_BUILD_WORK_DIR: "/var/build-work"
      DCMS_BUILD_NETWORK_BUILD: "none"
    depends_on:
      docker-socket-proxy:
        condition: service_started
    volumes:
      - build-work:/var/build-work

  # Least-privilege Docker API so the site-builder can launch per-build sandbox
  # containers WITHOUT mounting the raw (root-equivalent) docker socket itself.
  # Exposes only the container/image operations `docker run --rm` needs; the real
  # socket is mounted read-only here and nowhere else.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    privileged: true
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VERSION: "1"
      POST: "1"
      # Same reason as docker-socket-proxy-ro in the base file: `option httplog` narrates
      # every proxied request at info, and site-builder polls this one while a build runs.
      # `warning` keeps denials and backend failures and drops the narration.
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  site-host:
    environment:
      <<: *prod-env
      Services__ContentApi: "http://content-api:8080"

  # Like site-builder and platform-api, the edge deliberately does NOT inherit *prod-env: that
  # anchor carries the `dcms` OWNER connection string and the MinIO root account, and this is the
  # one process an anonymous request from the internet reaches first. It gets the scoped
  # dcms_edge role, which reaches the `edge` schema and nothing else.
  #
  # VAULT_ADDR and DCMS_REFUSE_DEV_VAULT are restated for exactly the reason spelled out on
  # site-builder: they live in that same anchor, and skipping it is how a service ends up
  # calling AddDcmsVault and silently reading nothing. Here that would be worse than silent --
  # Transit is what decrypts the TLS private keys, so a missing address means no certificate
  # loads and no certificate can be issued.
  edge:
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_ENVIRONMENT: "Production"
      DCMS_REFUSE_DEV_VAULT: "true"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dcms;Username=dcms_edge;Password=${EDGE_DB_PASSWORD:-dcms-edge-dev}"
      ConnectionStrings__Redis: "redis:6379"
      Nats__Url: "nats://nats:4222"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      Edge__AdminHost: "${ADMIN_HOST:-admin.highgeek.eu}"
      Edge__PlatformHost: "${PLATFORM_HOST:-platform.highgeek.eu}"
      Edge__GrafanaHost: "${GRAFANA_DOMAIN:-grafana.highgeek.eu}"
      Edge__GitHost: "${GIT_HOST:-git.highgeek.eu}"
      # THE EDGE TERMINATES TLS. Set EDGE_TLS_ENABLED=false in .env to hand :443 back to Caddy
      # -- together with the port variables below, that is the whole of the rollback, and it
      # needs no deploy. Caddy is still defined and still holds its own /data.
      Edge__Certificates__TlsEnabled: "${EDGE_TLS_ENABLED:-true}"
      # EVERY DEPLOYMENT SERVING PUBLIC NAMES MUST SET THIS. The default is staging on purpose:
      # a staging certificate is not trusted by any browser, so a host that forgot to set it
      # serves visible warnings rather than silently spending the real account's weekly budget
      # on hostnames that are not production's. docker-compose.vps.yml sets it for vps1.
      Edge__Certificates__AcmeDirectory: "${ACME_DIRECTORY:-https://acme-staging-v02.api.letsencrypt.org/directory}"
      Edge__Certificates__ContactEmail: "${ACME_EMAIL}"
      # Carries the certificates Caddy already holds into edge.certificates rather than
      # reissuing them. Harmless to leave on: it is idempotent, skips every hostname already
      # known, and becomes a no-op logged at Information once the mount goes away with Caddy.
      Edge__Certificates__ImportFromCaddyPath: "${EDGE_IMPORT_FROM_CADDY:-/caddy-data}"
      # Off until the cutover has been green for a while. HSTS is the one edge setting a
      # rollback cannot undo: a browser that has seen the header refuses plain HTTP for the
      # full max-age, so turning it on early turns a bad cutover into a bad week.
      Edge__Certificates__HstsMaxAgeSeconds: "${EDGE_HSTS_MAX_AGE:-0}"
      # Sign-on at the boundary: the edge authenticates against identity and gates Grafana on
      # SuperAdmin and the Forgejo web UI on being signed in at all. The authority is the PUBLIC
      # issuer because that is what identity stamps into every token; back-channel calls are
      # rewritten onto the internal address by InternalIdentityHandler rather than hairpinning
      # out through this proxy and back.
      Edge__Auth__Authority: "${PUBLIC_BASE_URL}"
      Edge__Auth__InternalAuthority: "http://identity:8080"
      # Must equal Identity__Edge__Secret. Unset disables edge authentication and both consoles
      # fall back to their own login -- deliberately, rather than taking the ingress down.
      Edge__Auth__ClientSecret: "${EDGE_OIDC_CLIENT_SECRET:-}"
    volumes:
      # Read-only. Caddy has been issuing certificates for the live tenant domains; reissuing
      # them all on cutover day spends the ~50-per-registered-domain-per-week budget on names
      # we already had. Goes away when Caddy does.
      - caddy-data:/caddy-data:ro

  ai-gateway:
    environment:
      <<: *prod-env
      Auth__Authority: "http://identity:8080/"
      Auth__Audience: "dcms-ai-gateway"
      Auth__RequireHttpsMetadata: "true"

  # Like site-builder, platform-api deliberately does NOT inherit *prod-env: it runs the
  # least-privilege dcms_platform role and must not be handed the owner connection string or
  # the audit chain key. VAULT_ADDR is set explicitly for the reason spelled out on
  # site-builder above -- it lives in that same anchor, and skipping the anchor is how a
  # service ends up calling AddDcmsVault and silently reading nothing from Vault. It holds no
  # Vault secrets today; this is here so that the day it does, it works.
  platform-api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_ENVIRONMENT: "Production"
      VAULT_ADDR: "http://vault:8200"
      # Refuse a dev-mode Vault, exactly as *prod-env does for the services that inherit it.
      # This service reads its ENTIRE database credential from Vault, so a Vault it cannot
      # trust is not something to fall back from -- it is a reason not to start.
      DCMS_REFUSE_DEV_VAULT: "true"
      # Blanked, not omitted. The base compose sets the dev root token published in this
      # repository, and without this line that value survives into a production container --
      # the same trap content-api's ServiceClient__ClientSecret documents two blocks below.
      # The vps overlay supplies the AppRole that actually authenticates this service.
      VAULT_TOKEN: ""
      # ConnectionStrings__Postgres is DELIBERATELY ABSENT. It carries the dcms_platform
      # password, so it comes from secret/dcms/platform-api and from nowhere else — leaving a
      # value here would also override Vault, which loads after the environment.
      ConnectionStrings__Redis: "redis:6379"
      Nats__Url: "nats://nats:4222"
      Auth__Authority: "http://identity:8080/"
      Auth__Audience: "dcms-platform-api"
      Auth__RequireHttpsMetadata: "true"
      Observability__PrometheusUrl: "http://prometheus:9090"
      Observability__LokiUrl: "http://loki:3100"
      Observability__TempoUrl: "http://tempo:3200"
      Observability__NatsMonitoringUrl: "http://nats:8222"
      Observability__VaultUrl: "http://vault:8200"
      # vps1 is 4 cores / 7.6 GB and swapless, with ~2.2 GB already committed to the
      # observability stack's limits. A ninth .NET service goes in with a ceiling rather than
      # on trust; watch infrastructure/11-containers.json for OOM kills after the first deploy.
    mem_limit: 256m

  platform-spa:
    environment:
      DCMS_OIDC_AUTHORITY: "${PUBLIC_BASE_URL}"
      DCMS_OIDC_CLIENT_ID: "dcms-platform-spa"
      # The API bases stay same-origin paths: Caddy routes /api/platform/*, /api/identity/* and
      # /api/* under the platform host to their three owners.
      DCMS_ADMIN_BASE: "${PUBLIC_BASE_URL}"
      DCMS_GRAFANA_BASE: "https://${GRAFANA_DOMAIN:-grafana.highgeek.eu}"
      # Drives the band across the top of the console. DCMS_ENV is already the variable that
      # says which environment this host is, and deploy.sh asserts it matches --env, so this
      # cannot drift from reality without the deploy failing first.
      DCMS_ENVIRONMENT_NAME: "${DCMS_ENV:-development}"

  # Git server. Caddy terminates TLS for the HTTP git+web UI ($GIT_HOST).
  #
  # dev and prod run SEPARATE Forgejo instances -- these are the tenants' actual site
  # repositories, and a dev deployment writing into production's git server would be a
  # cross-environment data path, not a test.
  # over the internal network; the base file already publishes SSH on :2222 and
  # binds HTTP to loopback. The clone/SSH URLs the UI hands out use the public host.
  forgejo:
    environment:
      FORGEJO__server__DOMAIN: "${GIT_HOST:-git.highgeek.eu}"
      FORGEJO__server__ROOT_URL: "https://${GIT_HOST:-git.highgeek.eu}/"
      FORGEJO__server__SSH_DOMAIN: "${GIT_HOST:-git.highgeek.eu}"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__webhook__ALLOWED_HOST_LIST: "private,loopback"

  # Public TLS edge for tenant domains.
  caddy:
    # The public ingress, and until now the one part of the stack a deploy could break
    # silently: a Caddyfile that fails to parse leaves the container up and every health
    # signal green while nothing is served. :2019 is Caddy's internal metrics listener,
    # declared in the Caddyfile itself, so a successful probe proves the running config
    # was loaded -- not merely that the process started.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    image: caddy:2
    restart: unless-stopped
    depends_on:
      site-host:
        condition: service_started
      forgejo:
        condition: service_started
    # OFF THE PUBLIC PORTS, but still running: the edge owns :80/:443 now. Kept rather than
    # deleted for one reason -- rollback. Caddy still holds its own /data and has never stopped
    # renewing, so handing the ports back is two variables and a `compose up -d`, with no
    # pipeline round trip while the site is down:
    #
    #   EDGE_TLS_ENABLED=false CADDY_HTTP_PUBLISH=80 CADDY_HTTPS_PUBLISH=443
    #   EDGE_HTTP_PUBLISH=127.0.0.1:8090 EDGE_HTTPS_PUBLISH=127.0.0.1:8453
    #
    # Delete this service, infra/caddy/ and the caddy-data/caddy-config volumes once the edge
    # has been green for a week.
    ports:
      - "${CADDY_HTTP_PUBLISH:-127.0.0.1:8081}:80"
      - "${CADDY_HTTPS_PUBLISH:-127.0.0.1:8444}:443"
    environment:
      ACME_EMAIL: "${ACME_EMAIL}"
      # The three named site blocks in the Caddyfile. Defaults are production's names, so
      # this is a no-op there; a dev host sets its own in .env. Without these the dev edge
      # would ask Let's Encrypt for a certificate for production's hostname -- which fails,
      # and keeps failing against the rate limit.
      ADMIN_HOST: "${ADMIN_HOST:-admin.highgeek.eu}"
      PLATFORM_HOST: "${PLATFORM_HOST:-platform.highgeek.eu}"
      GRAFANA_DOMAIN: "${GRAFANA_DOMAIN:-grafana.highgeek.eu}"
      GIT_HOST: "${GIT_HOST:-git.highgeek.eu}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  vault-data:
  caddy-data:
  caddy-config:
  # Per-build work area. The site-builder writes each build's files here and the
  # sandbox container bind-mounts them by host path (see DCMS_BUILD_WORK_HOST_ROOT,
  # set in the vps overlay). Anonymous named volume by default; re-pointed to a bind
  # mount on hosts that need a known host path for the nested docker run.
  build-work:
