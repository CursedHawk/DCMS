# NATS server config, replacing the flag-only startup so nats-surveyor can exist.
#
# ============================================================================
# READ THIS BEFORE DEPLOYING IT. This file changes how the server that carries
# every queue on the platform starts up. It is the riskiest single change in the
# observability work, and the deploy procedure for it is gated in
# infra/observability/README.md. Back up /home/cursedhawk/dcms-data/nats first.
# ============================================================================
#
# WHY IT IS NEEDED. nats-surveyor collects from the $SYS account — server stats,
# account stats, and the JetStream advisories that say when a consumer is falling
# behind. Without authentication configured, NATS has a $SYS account but no user
# who can log into it, so surveyor cannot connect. The plainer
# prometheus-nats-exporter needs none of this and is deployed first for exactly
# that reason; it reads the monitoring JSON on :8222 and carries the JetStream
# dashboards on its own. Surveyor is the enhancement.
#
# WHY THE SHAPE IS THIS SHAPE. The ten existing streams live in the default
# global account, $G. Moving them would mean losing them — a stream is scoped to
# its account and there is no migration. So $G stays exactly where it is and only
# gains a user; `no_auth_user` then maps every unauthenticated client to that
# user, which means:
#
#     none of the eight services change their connection string,
#     none of them gain a credential to manage,
#     and no stream moves.
#
# The one behavioural change is that $SYS now has a user, and that user is not
# reachable without the password.

jetstream {
  store_dir: /data
}

# The monitoring endpoint prometheus-nats-exporter already reads. Unauthenticated
# by design and unpublished to the host — the compose network is the only caller.
http_port: 8222

server_name: dcms-nats

accounts {
  # Only $SYS is declared. $G — the account the ten existing streams live in — is
  # deliberately absent, because NATS refuses to let you declare it:
  # `"$G" is a Reserved Account`. That is the whole reason this file is shaped the way it
  # is rather than the shape every NATS tutorial shows.
  #
  # The system account carries server statistics and JetStream advisories and nothing else:
  # no JetStream of its own, no application subjects.
  $SYS: {
    users: [
      { user: sys, password: $NATS_SYS_PASSWORD }
    ]
  }
}

# The application user, defined at the top level rather than inside an account. This is the
# documented way to put a user in $G: a user declared in the top-level authorization block
# belongs to the global account. Which means the ten streams stay exactly where they are —
# a stream is scoped to its account and there is no migration path between accounts, so
# "move the streams into a new account" and "lose the streams" are the same sentence.
authorization {
  users: [
    { user: app, password: $NATS_APP_PASSWORD }
  ]
}

system_account: "$SYS"

no_auth_user: app
