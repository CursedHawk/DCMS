apiVersion: 1

providers:
  - name: dcms
    orgId: 1
    type: file
    disableDeletion: false
    # Dashboards are code and live in infra/observability/grafana/dashboards/. Edits made in
    # the UI are overwritten on the next reload, which is intended — a dashboard someone
    # improved on a Friday afternoon and nobody committed is a dashboard that disappears the
    # next time this host is rebuilt.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      # Directory tree becomes the folder tree, so platform/, infrastructure/, application/,
      # audit-security/, business/ and ops/ are the folders you see in the sidebar.
      foldersFromFilesStructure: true
