apiVersion: 1

policies:
  - orgId: 1
    receiver: dcms-email
    group_by: [alertname, service]
    # Deliberately slow. An alert that mails on every evaluation trains the reader to ignore
    # it, and the failure mode of alerting on this platform is not missing an alert — it is
    # someone filtering the whole sender into a folder after a noisy week.
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: dcms-email
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 0s
        repeat_interval: 1h
      - receiver: dcms-email
        object_matchers:
          - ["severity", "=", "info"]
        # Informational alerts are recorded and visible on the dashboards; they do not need
        # to arrive by mail every twelve hours.
        repeat_interval: 168h
