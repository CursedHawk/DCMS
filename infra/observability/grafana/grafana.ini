; Grafana for the DCMS platform. Reachable only through the edge (Dcms.Edge) at
; $GRAFANA_DOMAIN — no host port is published, so the compose network is the only other way in.
; That is not incidental: the edge signs operators in and asserts them with X-WEBAUTH-USER, and
; that header is a bearer credential in header form. Publishing a port here would put it within
; reach of anything on the host.

[server]
; Both are also set as GF_SERVER_DOMAIN / GF_SERVER_ROOT_URL by compose, and a Grafana
; env var overrides the ini -- so these lines never actually decided anything. They are
; $__env{} now rather than production literals, because this file is bind-mounted into BOTH
; the dev and the production stack and a reader should not have to know the precedence rules
; to see which host it is describing.
domain = $__env{GRAFANA_DOMAIN}
root_url = $__env{GRAFANA_ROOT_URL}
; The edge terminates TLS and forwards over plain HTTP on the internal network, exactly as it
; does for identity and admin-api.
enforce_domain = false

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[users]
; Nobody self-registers through Grafana's own forms. Accounts appear the moment the edge
; asserts one (auth.proxy auto_sign_up below), and the edge only asserts a caller who got past
; its SuperAdmin policy -- so the gate is at the edge and this stays shut.
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false
; The local login form stays reachable on purpose: it is break-glass. Single sign-on now runs
; at the edge, and the moment identity -- or the edge -- is the thing that is broken is exactly
; the moment these dashboards are most needed. Disabling it would mean an outage in one service
; locked the operator out of the tool for diagnosing it. It is only reachable at all when the
; edge sends no header, which is precisely that case.
oauth_auto_login = false
signout_redirect_url =

[auth.anonymous]
enabled = false

[auth.basic]
; Off because it bypasses OAuth role mapping entirely — a valid basic credential would
; reach the data without ever being checked for SuperAdmin.
enabled = false

[auth.proxy]
; Grafana no longer speaks OIDC. The edge authenticates the operator against identity, refuses
; anyone who is not a platform SuperAdmin, and passes the result in a header.
;
; What that bought: an unauthorized request is now refused BEFORE it reaches Grafana, so a
; non-SuperAdmin never appears in Grafana's access log at all; there is one login for the whole
; platform rather than one per console; and the client secret, the role mapping and the refresh
; behaviour that used to live in this file are gone.
;
; What it costs: X-WEBAUTH-USER is a bearer credential in header form -- whoever can set it on a
; request that reaches Grafana IS that user. Two things make that safe, and BOTH are
; load-bearing rather than tidy:
;
;   1. The edge strips every X-WEBAUTH-* header from every INBOUND request before anything reads
;      one (Dcms.Edge HeaderScrubbing, with a test asserting exactly that). A client cannot
;      supply its own.
;   2. Grafana publishes no host port, so the compose network is the only other way in.
;
; There is deliberately no `whitelist` here. It wants an IP, and compose container addresses are
; assigned dynamically -- a value pinned today is wrong after the next `up`, and the failure is
; every operator locked out of the dashboards during whatever made them open the dashboards. The
; two guarantees above are the ones that actually hold.
enabled = true
header_name = X-WEBAUTH-USER
; The header carries an email address, which is also what the DCMS identity service considers
; the login. Keeping one identifier means an account here maps to an account there by eye.
header_property = email
auto_sign_up = true
; Extra attributes, so a new operator's account is not a bare email with no name and no role.
; Role is what makes them useful on arrival: without it they would land on auto_assign_org_role
; (Viewer), and a Viewer on these dashboards reads the whole platform anyway -- so the
; difference is friction, not a safety margin.
headers = Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME Role:X-WEBAUTH-ROLE
; Re-read the headers at most this often rather than on every request.
sync_ttl = 15
; Issue Grafana's own session cookie after the first proxied request, so the dashboard's own
; XHRs do not each re-run the account lookup.
enable_login_token = true

[security]
admin_user = admin
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
cookie_secure = true
cookie_samesite = lax
content_security_policy = true
disable_gravatar = true
; Grafana sits behind the edge, which already sets these; harmless and correct if it ever
; does not.
x_content_type_options = true
x_xss_protection = true
strict_transport_security = true

[dashboards]
min_refresh_interval = 10s

[alerting]
enabled = false

[unified_alerting]
enabled = true
; Alert state lives in Grafana's SQLite. It is small, and it is the one piece of
; observability state whose loss is merely inconvenient rather than a gap in the record.
execute_alerts = true

[log]
mode = console
level = info

[metrics]
enabled = true

[explore]
enabled = true

[feature_toggles]
; Trace-to-logs and trace-to-metrics correlation in Explore, which is what makes the
; trace-lookup workflow one click rather than three copy-pastes.
enable = traceToMetrics traceqlEditor
