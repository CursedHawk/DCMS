; Grafana for the DCMS platform. Reachable only through Caddy at $GRAFANA_DOMAIN --
; Caddy — no host port is published, so the compose network is the only other way in.

[server]
; Both are also set as GF_SERVER_DOMAIN / GF_SERVER_ROOT_URL by compose, and a Grafana
; env var overrides the ini -- so these lines never actually decided anything. They are
; $__env{} now rather than production literals, because this file is bind-mounted into BOTH
; the dev and the production stack and a reader should not have to know the precedence rules
; to see which host it is describing.
domain = $__env{GRAFANA_DOMAIN}
root_url = $__env{GRAFANA_ROOT_URL}
; Caddy terminates TLS and forwards over plain HTTP on the internal network, exactly as it
; does for identity and admin-api.
enforce_domain = false

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[users]
; Nobody self-registers. Access comes from being a SuperAdmin in the DCMS identity service
; and from nowhere else.
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false
; The local login form stays reachable on purpose: it is break-glass. Single sign-on runs
; through the identity service, and the moment identity is the thing that is broken is
; exactly the moment these dashboards are most needed. Disabling it would mean an outage in
; one service locked the operator out of the tool for diagnosing it.
oauth_auto_login = false
signout_redirect_url =

[auth.anonymous]
enabled = false

[auth.basic]
; Off because it bypasses OAuth role mapping entirely — a valid basic credential would
; reach the data without ever being checked for SuperAdmin.
enabled = false

[auth.generic_oauth]
enabled = true
name = DCMS
icon = signin
allow_sign_up = true
client_id = dcms-grafana
client_secret = $__env{GRAFANA_OIDC_CLIENT_SECRET}
; offline_access is what keeps a session alive, and leaving it out is why sessions did not
; last. The identity service issues 10-MINUTE access tokens (SetAccessTokenLifetime in
; Dcms.Identity/Program.cs), and `use_refresh_token = true` below makes Grafana check the
; OAuth token on each request and refresh it when it expires. OpenIddict only mints a refresh
; token when offline_access is among the GRANTED scopes -- the client's refresh_token grant
; permission alone is not enough, it merely permits the scope to be asked for. So Grafana had
; nothing to refresh with: ten minutes after signing in, every operator was thrown back to
; the login screen, in the middle of reading a dashboard, forever.
;
; It looked like a session-lifetime problem and was not: login_maximum_lifetime_duration and
; the token rotation interval were both at their (generous) defaults the whole time. The
; expiry that ended the session belonged to the upstream OAuth token, not to Grafana's own.
scopes = openid profile email roles offline_access
empty_scopes = false

; The browser follows auth_url, so it must be the public host. The token and userinfo calls
; are made by Grafana itself from inside the compose network, so they use the internal
; address — going out to the public name and back would depend on the host's NAT
; hairpinning, which is a thing that works until it doesn't.
auth_url = $__env{PUBLIC_BASE_URL}/connect/authorize
token_url = http://identity:8080/connect/token
api_url = http://identity:8080/connect/userinfo

use_pkce = true
use_refresh_token = true

; The DCMS userinfo endpoint (AuthorizationEndpoints.cs) returns sub, email, name and roles.
; There is no preferred_username, so the login name is the email address.
login_attribute_path = email
name_attribute_path = name
email_attribute_path = email

; Platform SuperAdmins get Grafana Admin; everyone else gets nothing.
;
; role_attribute_strict is the load-bearing half. Without it, a user whose token carries no
; matching role falls back to the auto_assign_org_role above — which is Viewer, and a Viewer
; on these dashboards can read every tenant's usage, every audit action and every trace on
; the platform. With it, an unmatched user is refused the login outright.
role_attribute_path = contains(roles[*], 'SuperAdmin') && 'GrafanaAdmin' || 'None'
role_attribute_strict = true
allow_assign_grafana_admin = true

[security]
admin_user = admin
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
cookie_secure = true
cookie_samesite = lax
content_security_policy = true
disable_gravatar = true
; Grafana sits behind Caddy, which already sets these; harmless and correct if it ever does not.
x_content_type_options = true
x_xss_protection = true
strict_transport_security = true

[dashboards]
min_refresh_interval = 10s

[alerting]
enabled = false

[unified_alerting]
enabled = true
; Alert state lives in Grafana's SQLite. It is small, and it is the one piece of
; observability state whose loss is merely inconvenient rather than a gap in the record.
execute_alerts = true

[log]
mode = console
level = info

[metrics]
enabled = true

[explore]
enabled = true

[feature_toggles]
; Trace-to-logs and trace-to-metrics correlation in Explore, which is what makes the
; trace-lookup workflow one click rather than three copy-pastes.
enable = traceToMetrics traceqlEditor
