# Tempo, single-binary, local blocks.
#
# Retention is 7 days — the shortest of the three stores, because traces are by far the
# largest signal per unit of insight and this host has 40 GB free in total.
#
# The consequence is worth being explicit about, because it is a limit on a promise this
# platform makes to its users: a trace id quoted more than a week later resolves to the
# audit record (kept 400 days, with the trace id on it) and the Loki lines (30 days), but
# not to a span tree. docs/runbook.md says so in the support workflow. Do not quietly let
# people believe otherwise.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  # Small, because a block is only searchable once flushed. Five minutes is roughly the
  # longest anyone will wait while looking at a trace id a user just gave them.

compactor:
  compaction:
    block_retention: 168h
    compacted_block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    # The service graph is the thing no single service can report: which service calls
    # which, derived from span parentage. On a platform whose interesting paths cross a
    # message bus, that graph is most of the architecture diagram, kept current for free.
    service_graphs:
      dimensions: [dcms.tenant.id]
    span_metrics:
      dimensions: [dcms.tenant.id, http.route]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
