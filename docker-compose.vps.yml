# Single-host VPS deployment overlay. Use AFTER the base and prod profiles:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps.yml up -d
#
# It layers three host-specific concerns on top of the generic prod profile:
#
#  1. Persistence — every stateful volume is bind-mounted under
#     /home/cursedhawk/dcms-data (Postgres, Redis, NATS, MinIO, Vault, Caddy),
#     so all data lives in one operator-visible directory instead of anonymous
#     Docker volumes.
#
#  2. Edge-TLS auth wiring — Caddy terminates TLS and reaches identity over
#     plain HTTP on the internal network, while tokens are issued under the
#     public HTTPS issuer (https://admin.highgeek.eu/). Resource servers must
#     therefore discover metadata at the *internal* http URL but validate the
#     *public* https issuer; identity disables OpenIddict's transport-security
#     requirement because TLS is already terminated at the edge. (The generic
#     prod profile leaves these at values that assume HTTPS all the way to
#     identity, which does not hold for a single-host Caddy edge.)
#
#  3. Seeding/secrets that the prod profile sets on the consumer but not the
#     issuer: the confidential admin-api client secret and the SuperAdmin login
#     are seeded into identity here, and the admin SPA gets the public OIDC
#     authority injected at runtime.
#
# ---------------------------------------------------------------------------
# THIS FILE IS SHARED BY dev AND production.
# ---------------------------------------------------------------------------
# It was written when vps1 was the only deployment, so it hardcoded that host's public
# names throughout -- the OIDC issuer, every registered redirect URI, Forgejo's clone URL,
# Grafana's root URL. dev and prod now resolve to this same three-file overlay set, and the
# ONLY things that distinguish them are the host's .env and the image digests. A hardcoded
# `admin.highgeek.eu` in here would make a dev deployment mint tokens claiming to be
# production's issuer, and register production's redirect URIs against dev's identity.
#
# So every public name comes from .env now, with the production values as defaults so this
# is a no-op for the existing host:
#
#   PUBLIC_BASE_URL   https://admin.dev.highgeek.eu   the OIDC issuer and SPA authority
#   GRAFANA_DOMAIN    grafana.dev.highgeek.eu
#   GIT_HOST          git.dev.highgeek.eu
#
# ADMIN_HOST is the bare-hostname form of PUBLIC_BASE_URL, needed because a Caddy site
# address is a hostname rather than a URL. scripts/deploy.sh asserts the two agree, so they
# cannot drift into a state where the edge and the issuer disagree about who this host is.

# Everything IdentitySeeder reads. It runs in the identity-migrate job, not in the identity
# service -- so config that lives only on `identity` reaches the seeder never. That is not
# hypothetical: the platform console's client was registered against localhost because these
# redirect URIs were set on `identity` alone, and OpenIddict then refused every sign-in with
# "The specified 'redirect_uri' is not valid for this client application".
#
# One anchor, merged into both, so they cannot diverge again.
x-vps-identity-seed: &vps-identity-seed
  Identity__SuperAdmin__Email: "${SUPERADMIN_EMAIL}"
  Identity__Spa__RedirectUris: "${PUBLIC_BASE_URL}/auth/callback"
  Identity__Spa__PostLogoutUris: "${PUBLIC_BASE_URL}/"
  Identity__PlatformSpa__RedirectUris: "https://${PLATFORM_HOST:-platform.highgeek.eu}/auth/callback"
  Identity__PlatformSpa__PostLogoutUris: "https://${PLATFORM_HOST:-platform.highgeek.eu}/"
  # The edge's OIDC client, which replaced Grafana's own. The secret must equal the edge
  # container's Edge__Auth__ClientSecret; it stays in .env rather than Vault because two
  # different services read it and a value that lived in one service's Vault path would have to
  # be duplicated into the other's, where the two copies can drift apart in silence.
  #
  # Left unset -> the client is not seeded, the edge disables its own authentication, and
  # Grafana and Forgejo fall back to their own sign-in. That is the safe direction to fail:
  # this is the public ingress, and refusing to serve tenant sites over a missing operator
  # credential would be the wrong trade.
  #
  # One redirect URI per gated host. Exact matches, not a wildcard -- that is what makes a
  # stolen authorization code useless on the other host.
  Identity__Edge__Secret: "${EDGE_OIDC_CLIENT_SECRET:-}"
  Identity__Edge__RedirectUris: "https://${GRAFANA_DOMAIN:-grafana.highgeek.eu}/.edge/signin-oidc;https://${GIT_HOST:-git.highgeek.eu}/.edge/signin-oidc"
  Identity__Edge__PostLogoutUris: "https://${GRAFANA_DOMAIN:-grafana.highgeek.eu}/.edge/signout-callback-oidc;https://${GIT_HOST:-git.highgeek.eu}/.edge/signout-callback-oidc"

x-vps-resource-auth: &vps-resource-auth
  # Discover the OIDC metadata internally over HTTP (no public DNS / TLS needed
  # inside the compose network), but accept only tokens whose issuer is the
  # public HTTPS value that identity actually stamps onto them.
  Auth__Authority: "${PUBLIC_BASE_URL}/"
  Auth__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
  Auth__Issuer: "${PUBLIC_BASE_URL}/"
  Auth__RequireHttpsMetadata: "false"

# SMTP for email-worker, the one service that delivers mail. Everything that wants
# to send (identity: password resets; content-api: form-submission notifications)
# publishes to the EMAIL work queue instead, so relay credentials live in exactly
# one container.
#
# There is no anchor here any more: the whole Email__* set is in Vault under
# secret/dcms/email-worker, readable by that service's AppRole and nothing else.
# Without it email-worker falls back to appsettings, which targets the in-cluster
# Mailpit — mail is captured rather than delivered, which is the safe direction to
# fail but is not always an obvious one, so check the path before blaming the relay.
#
# Note for relays that police the envelope sender (iCloud, Gmail): Email__FromAddress
# must be the authenticated account or one of its verified aliases, or the relay
# rejects the message with a 5xx and email-worker drops it as permanently undeliverable.

services:
  # Vault writes to a bind-mounted dir owned by the deploy user (cursedhawk,
  # uid 1001); run the process as that uid so it can write without a root chown.
  # The image entrypoint only drops privileges when started as root, so setting
  # the user here means Vault runs directly as 1001 (mlock is disabled in
  # config.hcl, which it must be since a non-root process has no CAP_IPC_LOCK).
  vault:
    user: "1001:1001"

  # Forgejo's data dir is bind-mounted under the cursedhawk-owned dcms-data tree
  # (uid 1001). The image creates its internal git user with USER_UID/USER_GID and
  # runs as it, so align those to 1001 to match the host dir ownership (same
  # pattern as vault above). The deploy step creates dcms-data/forgejo owned 1001.
  forgejo:
    environment:
      USER_UID: "1001"
      USER_GID: "1001"

  # The prod profile overrides the MinIO server credentials but not the one-shot
  # bucket provisioner, which would otherwise authenticate with the dev password
  # and fail. Point it at the real credentials too.
  minio-init:
    environment:
      MINIO_URL: "http://minio:9000"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      # Least-privilege service account for the site-builder (scoped to the site
      # buckets), created by infra/minio/init.sh. Must match the site-builder's
      # Storage__AccessKey/SecretKey in the prod overlay.
      SITEBUILDER_MINIO_USER: "${SITEBUILDER_MINIO_USER:-dcms-sitebuilder}"
      SITEBUILDER_MINIO_PASSWORD: "${SITEBUILDER_MINIO_PASSWORD:-dcms-sitebuilder-dev}"

  # Host-specific sandbox wiring: DCMS_BUILD_WORK_HOST_ROOT is the host path that
  # backs the builder's /var/build-work bind (see the build-work volume below), which
  # the nested `docker run` needs to mount each per-build dir into the sandbox.
  # The platform console's API and the log-janitor sidecar, each with its own AppRole. The
  # janitor's policy reads exactly one key from one path -- it is the container with write
  # access to Docker's container directory, so it gets the narrowest secret reach in the stack.
  platform-api:
    environment:
      # The same anchor every other resource server uses. Without it this service kept the
      # prod file's Auth__Authority of http://identity:8080/ alongside RequireHttpsMetadata
      # true, and JwtBearer refuses that combination -- not at startup, but on the first
      # request to touch authentication, which includes /health/live. The container came up,
      # answered 500 to its own healthcheck, and failed the deploy gate.
      <<: *vps-resource-auth
      Auth__Audience: "dcms-platform-api"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_PLATFORM_API:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_PLATFORM_API:-}"

  log-janitor:
    environment:
      VAULT_ADDR: "http://vault:8200"
      # Blanked, not omitted: the base file sets a dev root token, and without this that value
      # would survive into a production container.
      VAULT_TOKEN: ""
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_LOG_JANITOR:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_LOG_JANITOR:-}"

  site-builder:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_SITE_BUILDER:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_SITE_BUILDER:-}"
      DCMS_BUILD_WORK_HOST_ROOT: "/home/cursedhawk/dcms-data/build-work"
      # Set DCMS_BUILD_RUNTIME=runsc in .env once gVisor is installed on the host
      # (/etc/docker/daemon.json) for kernel-level isolation. Until then each build
      # still runs in a scrubbed, no-network, cap-dropped ephemeral container.
      DCMS_BUILD_RUNTIME: "${DCMS_BUILD_RUNTIME:-}"

  # ---------- Vault AppRole credentials ----------
  #
  # One role per service, each scoped by infra/vault/policies/dcms-<service>.hcl to
  # secret/dcms/shared plus its own path. The deployment this replaces gave every service the
  # SAME token with read on secret/data/dcms/*, so any one container could read the SMTP relay
  # password and the Forgejo admin token.
  #
  # Provision with infra/vault/apply.sh, then per service:
  #   vault read  -field=role_id      auth/approle/role/dcms-<service>/role-id
  #   vault write -f -field=secret_id auth/approle/role/dcms-<service>/secret-id
  #
  # The secret id is a credential: this host's .env (chmod 600), never git.
  #
  # There is no fallback left. VAULT_TOKEN is empty and the shared token is revoked, so a
  # service whose pair is missing reaches Vault with no credentials, reads nothing, and
  # fails its own startup guard. That is the intended end state — during the migration an
  # unset pair silently meant "use the token that can read everything".

  # ---------- migration jobs ----------
  #
  # These run the DDL and then exit, but they are built from the same images and load the
  # same configuration, so they need the same Vault access: identity-migrate cannot
  # construct OpenIddict without the signing certificate, and migrate cannot construct the
  # audit recorder without the chain key. They had no AppRole while those values were also
  # in .env, which hid the dependency; with .env emptied they would have been the first
  # thing to fail, before any service rolled.
  #
  # They reuse the role of the service whose image they are (secret_id_num_uses is 0, so
  # the same secret id logs in as many times as it likes) rather than getting roles of
  # their own — a migration job that could read something its service cannot would be a
  # second, quieter grant of the same secrets.
  migrate:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_ADMIN_API:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_ADMIN_API:-}"

  # This is the job that actually runs IdentitySeeder.
  identity-migrate:
    environment:
      <<: *vps-identity-seed
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_IDENTITY:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_IDENTITY:-}"

  identity:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_IDENTITY:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_IDENTITY:-}"
      # Public issuer (matches PUBLIC_BASE_URL). TLS is terminated at Caddy, so
      # identity itself speaks HTTP on the internal network — disable the
      # transport-security requirement (there is no ForwardedHeaders middleware).
      Identity__Issuer: "${PUBLIC_BASE_URL}/"
      Identity__AllowInsecureHttp: "true"
      # The confidential client secret admin-api presents for client-credentials, the
      # SuperAdmin first-boot password, the Google SSO pair and the Forgejo admin token
      # are all read from secret/dcms/identity now. Identity__AdminApiService__Secret
      # must still equal admin-api's ServiceClient__ClientSecret — they are the two
      # sides of one credential, held in two paths so neither service's AppRole implies
      # the other's. Changing one without the other fails every service-to-service call.
      #
      # Google SSO stays optional: with no Authentication__Google__* keys in that path
      # the sign-in/up pages simply omit the button. The redirect URI to register in
      # the Google Cloud console is ${PUBLIC_BASE_URL}/signin-google.
      #
      # The SuperAdmin EMAIL is not a secret and stays here — admin-api also reads it as
      # the default alert recipient, and a value in two places is a value that drifts.
      # Seeding config comes from the shared anchor, so this block and identity-migrate
      # cannot disagree about which URIs a client is registered against.
      <<: *vps-identity-seed
      # Forgejo user mirror: identity provisions a Forgejo account per DCMS user and
      # keeps email+password in sync so users can clone/pull/push with their own
      # credentials. The admin token needs the write:admin scope; provisioning is a
      # no-op while secret/dcms/identity holds no Forgejo__AdminToken.
      Forgejo__BaseUrl: "http://forgejo:3000"
      Forgejo__PublicUrl: "https://${GIT_HOST:-git.highgeek.eu}"

  admin-api:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_ADMIN_API:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_ADMIN_API:-}"
      <<: *vps-resource-auth
      Auth__Audience: "dcms-admin-api"
      # Alert delivery. The secret must equal the grafana container's ALERT_WEBHOOK_SECRET,
      # and Grafana cannot read Vault, so this stays in .env on both sides — moving it
      # would create a second copy to rotate rather than removing one.
      # Recipients default to the platform SuperAdmin, who is the person who would be
      # woken up anyway; override with a comma-separated ALERT_RECIPIENTS in .env.
      Alerting__WebhookSecret: "${ALERT_WEBHOOK_SECRET:-}"
      Alerting__Recipients: "${ALERT_RECIPIENTS:-${SUPERADMIN_EMAIL}}"
      # Forgejo git backend (see [[vps1-forgejo]]). The API token, the write:admin token
      # for repo collaborator grants, and the push-webhook HMAC secret are all read from
      # secret/dcms/admin-api. The forgejo CONTAINER needs none of them — they are tokens
      # minted inside Forgejo and presented to it — which is what makes them movable,
      # unlike the Postgres and MinIO credentials next door.
      #
      # Forgejo__WebhookSecret has no fallback any more. It used to default to a value
      # published in this repository, which meant a host that never set it verified push
      # webhooks against a secret anyone could read. Absent, admin-api registers no
      # webhook rather than a forgeable one; re-provision after setting it.
      Forgejo__BaseUrl: "http://forgejo:3000"
      Forgejo__PublicUrl: "https://${GIT_HOST:-git.highgeek.eu}"
      Forgejo__SshHost: "${GIT_HOST:-git.highgeek.eu}"
      Forgejo__SshPort: "2222"

  content-api:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_CONTENT_API:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_CONTENT_API:-}"
      <<: *vps-resource-auth
      # content-api validates platform tokens for chat agents (aud dcms-admin-api).
      Auth__Audience: "dcms-admin-api"

  # Sole holder of the SMTP relay credentials, which it reads from
  # secret/dcms/email-worker with the AppRole below and nothing else.
  email-worker:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_EMAIL_WORKER:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_EMAIL_WORKER:-}"

  ai-gateway:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_AI_GATEWAY:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_AI_GATEWAY:-}"
      <<: *vps-resource-auth
      Auth__Audience: "dcms-ai-gateway"

  admin-spa:
    # The SPA fetches OIDC discovery from here. Supplied at RUNTIME so this host's hostname is
    # not compiled into the image -- the same digest built on master serves dev and production,
    # which is what makes promoting a tested artifact possible.
    environment:
      DCMS_OIDC_AUTHORITY: "${PUBLIC_BASE_URL}"

  # Grafana publishes no host port in any profile — Caddy is the only route in
  # (infra/caddy/Caddyfile), the same shape as admin-spa and forgejo.
  #
  # Its hostname used to be hardcoded here. That override silently won over the base
  # compose's ${GRAFANA_ROOT_URL} / ${GRAFANA_DOMAIN}, so those variables looked configurable
  # and were not. Removed: the base file is the one place that decides, and the OIDC redirect
  # URI seeded into identity above is built from the same variable, so the two cannot disagree.

  # ---- NATS $SYS account ----
  #
  # Replaces NATS's flag-only startup with a config file, which is what gives nats-surveyor
  # a system account to collect from. The ten streams stay in $G and `no_auth_user` keeps
  # all eight services connecting exactly as they did — none of them gained a credential.
  #
  # This is the server that carries every queue on the platform and the failure mode of
  # getting it wrong is "the streams are gone", so it was landed through the gate in
  # infra/observability/README.md: store dir backed up, then the config proved against a
  # throwaway container pointed at a *copy* of it. That rehearsal is what caught both real
  # defects — `system_account: $SYS` unquoted is read as a variable reference, and `$G`
  # cannot be declared as an account at all — before either could touch production.
  nats:
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_PASSWORD: "${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD in .env}"
      NATS_SYS_PASSWORD: "${NATS_SYS_PASSWORD:?set NATS_SYS_PASSWORD in .env}"
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro

  # Collects from the $SYS account the config above creates: per-account statistics and the
  # JetStream advisories that say when a consumer is falling behind, which the plain
  # monitoring endpoint does not expose. nats-exporter in the base file still runs alongside
  # it and still carries stream depth and consumer lag — the two overlap deliberately, and
  # the cheaper one is the one anyone pages on.
  nats-surveyor:
    image: natsio/nats-surveyor:0.9.11
    restart: unless-stopped
    # Spelled out rather than anchored: YAML anchors do not cross compose files, so
    # *default-logging from the base file is not in scope here.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 128m
    command:
      - --servers=nats://nats:4222
      - --user=sys
      - --password=${NATS_SYS_PASSWORD:-}
      - --port=7777
      - --accounts
      - --jetstream=true
    depends_on:
      nats:
        condition: service_started

# Re-point every named volume from the prod profile at a bind mount under
# /home/cursedhawk/dcms-data. The host directories are created (with the right
# ownership for each container) before `up` — see the deploy steps.

  media-worker:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_MEDIA_WORKER:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_MEDIA_WORKER:-}"

  site-host:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_SITE_HOST:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_SITE_HOST:-}"

  # The YARP edge: vps1's public ingress on :80 and :443, terminating TLS for the platform
  # hostnames and every tenant custom domain. Caddy is still defined (docker-compose.prod.yml)
  # but published only on loopback, so handing the ports back is an .env change and a
  # `compose up -d` -- the rollback is written out on the caddy service itself.
  #
  # Verify from the host with an explicit Host header, which is the whole of what the route
  # table keys on:
  #   curl -si -H 'Host: admin.highgeek.eu'    http://127.0.0.1/api/admin/domains
  #   curl -si -H 'Host: platform.highgeek.eu' http://127.0.0.1/api/platform/observability
  #   openssl s_client -servername admin.highgeek.eu -connect 127.0.0.1:443 </dev/null \
  #     | openssl x509 -noout -issuer -serial -dates
  #
  # The container runs as a non-root uid and cannot bind :80/:443 itself; Docker does the
  # privileged half, which is why the listeners stay on 8080/8443.
  # Edge:Certificates:PublicHttpsPort (443) is what redirects are built from, never the
  # listener port -- a browser sent to https://host:8443/ lands where nothing is published.
  edge:
    environment:
      VAULT_ROLE_ID: "${VAULT_ROLE_ID_EDGE:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID_EDGE:-}"
      # vps1 serves the real public hostnames, so it orders from the real CA. Set here rather
      # than in the shared prod overlay deliberately: staging stays the default everywhere
      # else, so a second deployment cannot quietly spend this account's weekly budget.
      Edge__Certificates__AcmeDirectory: "${ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "${EDGE_HTTP_PUBLISH:-80}:8080"
      - "${EDGE_HTTPS_PUBLISH:-443}:8443"

volumes:
  postgres-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/postgres }
  redis-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/redis }
  nats-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/nats }
  minio-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/minio }
  vault-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/vault }
  caddy-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/caddy-data }
  caddy-config:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/caddy-config }
  forgejo-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/forgejo }
  # Per-build work area, bind-mounted so the nested sandbox `docker run` can mount
  # each build dir by host path. Create the dir before `up` (chmod 0777 so both the
  # builder and the sandbox uid can write): mkdir -p dcms-data/build-work.
  build-work:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/build-work }
  # Telemetry stores. Same one-visible-directory convention as everything else, and the same
  # ownership caveat: Docker does not chown a bind mount, so these must exist and be owned by
  # uid 1001 before `up`, which is why each of those containers pins user: "1001:1001".
  # Budget (see infra/observability/README.md): prometheus 8 GB, loki 8 GB, tempo 4 GB.
  prometheus-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/prometheus }
  loki-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/loki }
  tempo-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/tempo }
  grafana-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/grafana }
  alloy-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /home/cursedhawk/dcms-data/alloy }
